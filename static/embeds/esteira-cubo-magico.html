<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Esteira do Cubo Mágico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Figura isométrica interativa: a esteira de testes de software como um cubo mágico — requisitos, unitário, integração, sistema, performance, E2E e aceitação.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one figure card (header · drawing plate · hint/readout), controls, a ruled table of the six stages, keys and caption. Dossier tokens; Paper / Void / Blueprint. */
:root {
  --paper: #f4f4f1; --panel: #e6e6e1; --ink: #0b0c0e; --ink-muted: #50535a; --rule-soft: #c6c7c1;
  --signal: #002fa7; --signal-tint: #d7dff3; --on-signal: #ffffff; --error: #b42318;
  --f-top: #fafaf8; --f-y: #e6e6e3; --f-x: #d3d4d1; --f-cyl: #dddeda; --f-cap: #f1f1ee; --f-deep: #aeaead; --f-belt: #cbccc7;
  --ln-hi: #0b0c0e; --ln-mid: #2a2c31; --ln-lo: #5c5f66; --ln-soft: #b4b5af; --dot: #cfd0ca;
  --cb-t: #3a3c42; --cb-y: #26282c; --cb-x: #1b1c1f; --cb-ln: #0b0c0e;
  --st-w: #fbfbf9; --st-l: #c6c8c2; --st-m: #969a9f; --st-g: #26282c; --sheet: #fdfdfb;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0a0b0d; --panel: #16181d; --ink: #eeeeea; --ink-muted: #9ea1a8; --rule-soft: #2c2f36;
    --signal: #2b7fff; --signal-tint: #101a3c; --on-signal: #0a0b0d; --error: #ff6a55;
    --f-top: #38383a; --f-y: #232425; --f-x: #18191a; --f-cyl: #1f2022; --f-cap: #2e2f31; --f-deep: #0e0f11; --f-belt: #121315;
    --ln-hi: #eeeeea; --ln-mid: #cfd0cd; --ln-lo: #8f9299; --ln-soft: #3a3d44; --dot: #23262c;
    --cb-t: #2a2b2f; --cb-y: #18191c; --cb-x: #101113; --cb-ln: #d9dad6;
    --st-w: #e8e8e4; --st-l: #a8aaa5; --st-m: #74777e; --st-g: #141518; --sheet: #26272a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0a0b0d; --panel: #16181d; --ink: #eeeeea; --ink-muted: #9ea1a8; --rule-soft: #2c2f36;
  --signal: #2b7fff; --signal-tint: #101a3c; --on-signal: #0a0b0d; --error: #ff6a55;
  --f-top: #38383a; --f-y: #232425; --f-x: #18191a; --f-cyl: #1f2022; --f-cap: #2e2f31; --f-deep: #0e0f11; --f-belt: #121315;
  --ln-hi: #eeeeea; --ln-mid: #cfd0cd; --ln-lo: #8f9299; --ln-soft: #3a3d44; --dot: #23262c;
  --cb-t: #2a2b2f; --cb-y: #18191c; --cb-x: #101113; --cb-ln: #d9dad6;
  --st-w: #e8e8e4; --st-l: #a8aaa5; --st-m: #74777e; --st-g: #141518; --sheet: #26272a;
  color-scheme: dark;
}
:root[data-skin="paper"] {
  --paper: #f4f4f1; --panel: #e6e6e1; --ink: #0b0c0e; --ink-muted: #50535a; --rule-soft: #c6c7c1;
  --signal: #002fa7; --signal-tint: #d7dff3; --on-signal: #ffffff; --error: #b42318;
  --f-top: #fafaf8; --f-y: #e6e6e3; --f-x: #d3d4d1; --f-cyl: #dddeda; --f-cap: #f1f1ee; --f-deep: #aeaead; --f-belt: #cbccc7;
  --ln-hi: #0b0c0e; --ln-mid: #2a2c31; --ln-lo: #5c5f66; --ln-soft: #b4b5af; --dot: #cfd0ca;
  --cb-t: #3a3c42; --cb-y: #26282c; --cb-x: #1b1c1f; --cb-ln: #0b0c0e;
  --st-w: #fbfbf9; --st-l: #c6c8c2; --st-m: #969a9f; --st-g: #26282c; --sheet: #fdfdfb;
  color-scheme: light;
}
:root[data-skin="void"] {
  --paper: #0a0b0d; --panel: #16181d; --ink: #eeeeea; --ink-muted: #9ea1a8; --rule-soft: #2c2f36;
  --signal: #2b7fff; --signal-tint: #101a3c; --on-signal: #0a0b0d; --error: #ff6a55;
  --f-top: #38383a; --f-y: #232425; --f-x: #18191a; --f-cyl: #1f2022; --f-cap: #2e2f31; --f-deep: #0e0f11; --f-belt: #121315;
  --ln-hi: #eeeeea; --ln-mid: #cfd0cd; --ln-lo: #8f9299; --ln-soft: #3a3d44; --dot: #23262c;
  --cb-t: #2a2b2f; --cb-y: #18191c; --cb-x: #101113; --cb-ln: #d9dad6;
  --st-w: #e8e8e4; --st-l: #a8aaa5; --st-m: #74777e; --st-g: #141518; --sheet: #26272a;
  color-scheme: dark;
}
:root[data-skin="blueprint"] {
  --paper: #0f3270; --panel: #163b80; --ink: #f1f5ff; --ink-muted: #b4c7ec; --rule-soft: #2f5aa3;
  --signal: #7fdcff; --signal-tint: #1d4a96; --on-signal: #0f3270; --error: #ff9282;
  --f-top: #2f4d85; --f-y: #21427b; --f-x: #183a75; --f-cyl: #1d3e79; --f-cap: #284882; --f-deep: #0b2654; --f-belt: #143670;
  --ln-hi: #f1f5ff; --ln-mid: #d6e1f8; --ln-lo: #9fb6e2; --ln-soft: #3a63ab; --dot: #22468a;
  --cb-t: #0f2c60; --cb-y: #0a2352; --cb-x: #071c45; --cb-ln: #d6e1f8;
  --st-w: #eef3ff; --st-l: #9fb6e2; --st-m: #5679b8; --st-g: #0a2352; --sheet: #22427a;
  color-scheme: dark;
}

body { background: var(--paper); color: var(--ink); font-family: var(--sans); }
.page {
  max-width: 1180px; margin: 0 auto;
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 24px;
}
figure { margin: 0; display: grid; gap: 24px; min-width: 0; }
.label { font-family: var(--mono); font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
.muted { color: var(--ink-muted); }

/* Card */
.card { border: 1px solid var(--ink); background: var(--paper); min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; padding: 12px 16px; border-bottom: 1px solid var(--ink); flex-wrap: wrap; }
.fig-n { display: inline-flex; align-items: center; gap: 8px; }
.fig-n::before { content: ""; width: 8px; height: 8px; background: var(--signal); }
.card-title { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 24px; letter-spacing: .02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.plate { position: relative; cursor: pointer; overflow-x: auto; overscroll-behavior-x: contain; }
.plate svg { display: block; width: 100%; height: auto; }
.plate:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--paper), inset 0 0 0 4px var(--signal); }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; padding: 10px 16px; border-top: 1px solid var(--rule-soft); flex-wrap: wrap; }
.h-narrow { display: none; }
.readout { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12px; line-height: 16px; letter-spacing: .05em; text-transform: uppercase; font-variant-numeric: tabular-nums; min-width: 0; margin-left: auto; text-align: right; }
.readout #ro-text { min-width: 0; }

.flag { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--ink); font-family: var(--mono); font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.flag::before { content: ""; width: 7px; height: 7px; background: var(--ink); flex: none; }
.flag[data-s="run"] { border-color: var(--signal); color: var(--signal); }
.flag[data-s="run"]::before { background: var(--signal); }
.flag[data-s="fail"] { background: var(--error); border-color: var(--error); color: var(--on-signal); }
.flag[data-s="fail"]::before { background: var(--on-signal); }
.flag[data-s="skip"], .flag[data-s="pend"], .flag[data-s="idle"] { border-style: dashed; border-color: var(--ink-muted); color: var(--ink-muted); }
.flag[data-s="skip"]::before, .flag[data-s="pend"]::before, .flag[data-s="idle"]::before { background: none; outline: 1px solid var(--ink-muted); outline-offset: -1px; }
.flag[data-s="none"] { border-color: transparent; color: var(--ink-muted); padding-left: 0; }
.flag[data-s="none"]::before { display: none; }

/* Controls */
.controls { display: flex; justify-content: space-between; gap: 16px 32px; flex-wrap: wrap; }
.ctl { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 0 0 1px 1px; }
.seg button { font-family: var(--mono); font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
  background: var(--paper); color: var(--ink); border: 1px solid var(--ink); margin: 0 0 -1px -1px; padding: 7px 11px; cursor: pointer; }
.seg button:hover { text-decoration: underline; text-decoration-color: var(--signal); text-underline-offset: 3px; }
.seg button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal); color: var(--on-signal); position: relative; }
.seg button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--signal); position: relative; z-index: 1; }

/* Stage table */
.stages { min-width: 0; }
.stages-head, .row { display: grid; grid-template-columns: 40px minmax(0, 1.7fr) minmax(0, 1.25fr) 104px 104px; gap: 8px 20px; align-items: start; }
.stages-head { padding: 0 12px 8px; border-bottom: 2px solid var(--ink); }
.stages ol { list-style: none; margin: 0; padding: 0; }
.row { padding: 12px; border-bottom: 1px solid var(--rule-soft); }
.row[data-active="1"] { background: var(--signal-tint); }
.row .num { font-family: var(--mono); font-size: 13px; line-height: 20px; font-variant-numeric: tabular-nums; color: var(--ink-muted); }
.row[data-active="1"] .num { color: var(--signal); }
.row h3 { margin: 0 0 2px; font-family: var(--sans); font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.row p { margin: 0; font-size: 14px; line-height: 21px; max-width: 60ch; }
.row .crit { font-family: var(--mono); font-size: 13px; line-height: 20px; font-variant-numeric: tabular-nums; }
.row .cell-flag { display: flex; }
.row .k { display: none; }

/* Keys + caption */
.notes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 16px 32px; border-top: 1px solid var(--rule-soft); padding-top: 16px; }
.keys { display: grid; gap: 14px; align-content: start; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 0; padding: 0; list-style: none; }
.legend li { display: inline-flex; align-items: center; gap: 8px; }
.sw { width: 10px; height: 10px; border: 1px solid var(--ink); flex: none; }
.sw.pend { background: var(--paper); border-color: var(--ink-muted); border-style: dashed; }
.sw.run { background: var(--signal); border-color: var(--signal); }
.sw.pass { background: var(--ink); }
.sw.fail { background: var(--error); border-color: var(--error); }
.sw.skip { background: linear-gradient(to top right, transparent calc(50% - .5px), var(--ink-muted) calc(50% - .5px), var(--ink-muted) calc(50% + .5px), transparent calc(50% + .5px)); border-color: var(--ink-muted); border-style: dashed; }
.stk svg { width: 16px; height: 16px; display: block; }
figcaption { font-size: 12px; line-height: 18px; color: var(--ink-muted); max-width: 76ch; margin: 0; }
figcaption b { color: var(--ink); font-weight: 600; }
figcaption p { margin: 0 0 8px; }

@media (max-width: 860px) {
  .stages-head { display: none; }
  .row { grid-template-columns: 32px minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "n w w" "n c c" "n t a"; gap: 6px 12px; }
  .row .num { grid-area: n; } .row .what { grid-area: w; } .row .crit { grid-area: c; }
  .row .tcell { grid-area: t; } .row .acell { grid-area: a; }
  .row .k { display: block; margin-bottom: 4px; }
  .notes { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .plate svg { width: 960px; max-width: none; }
  .h-wide { display: none; } .h-narrow { display: inline; }
  .card-title { font-size: 17px; line-height: 20px; }
  .readout { margin-left: 0; text-align: left; }
}

/* ---- drawing ---- */
.rig path, .rig line { vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.rig .ft { fill: var(--f-top); } .rig .fy { fill: var(--f-y); } .rig .fx { fill: var(--f-x); }
.rig .fc { fill: var(--f-cyl); } .rig .fk { fill: var(--f-cap); } .rig .fd { fill: var(--f-deep); }
.rig .belt { fill: var(--f-belt); }
.rig .lo { stroke: var(--ln-lo); stroke-width: 1; }
.rig .mid { stroke: var(--ln-mid); stroke-width: 1; }
.rig .hi { stroke: var(--ln-hi); stroke-width: 1.3; }
.rig .ln { fill: none; }
.rig .soft { stroke: var(--ln-soft); stroke-width: 1; }
.rig .thin { stroke-width: .8; }
.rig .dotf { fill: var(--ln-mid); stroke: none; }
.rig .eng { fill: var(--ln-lo); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.rig .prt { fill: var(--ink); font-family: var(--mono); font-weight: 500; }
.rig .grid-dot { fill: var(--dot); }
.rig .reg { stroke: var(--rule-soft); stroke-width: 1; fill: none; }
.rig .sheet { fill: var(--sheet); stroke: var(--ln-lo); stroke-width: .9; }
.rig .sheet-b { fill: none; stroke: var(--ln-lo); stroke-width: .9; }
.rig .sheet-b.act { stroke: var(--signal); stroke-width: 2; }
.rig .screen { fill: var(--panel); stroke: var(--ln-mid); stroke-width: 1; }
.rig .scr-ln { fill: none; stroke: var(--ln-soft); stroke-width: 1; }
.rig .scr-t { fill: var(--ink-muted); font-family: var(--mono); font-weight: 500; letter-spacing: .08em; }
.rig .scan { fill: none; stroke: var(--signal); stroke-width: 1.8; }
.rig .mism { fill: none; stroke: var(--error); stroke-width: 1.8; }
/* cube */
.rig .cb { stroke: var(--cb-ln); stroke-width: .9; }
.rig .cbt { fill: var(--cb-t); } .rig .cby { fill: var(--cb-y); } .rig .cbx { fill: var(--cb-x); }
.rig .st { stroke: none; }
.rig .sw { fill: var(--st-w); } .rig .sl { fill: var(--st-l); } .rig .sm { fill: var(--st-m); }
.rig .gl-l { fill: none; stroke: var(--st-g); stroke-width: .9; }
.rig .gl-f { fill: var(--st-g); stroke: none; }
.rig .hl-act { fill: none; stroke: var(--signal); stroke-width: 2.2; }
.rig .hl-bad { fill: none; stroke: var(--error); stroke-width: 2.4; }
/* instruments */
.rig .needle { fill: none; stroke: var(--ln-hi); stroke-width: 1.4; }
.rig .redzone { fill: none; stroke: var(--error); stroke-width: 2.6; stroke-linecap: butt; }
.rig .tab { fill: var(--ln-hi); stroke: none; }
.rig .peak { fill: none; stroke: var(--ln-lo); stroke-width: 1; stroke-dasharray: 2 1.5; }
.rig .peak.over { stroke: var(--error); stroke-width: 1.4; stroke-dasharray: none; }
.rig .cell { fill: none; stroke: var(--ln-lo); stroke-width: .8; }
.rig .cell[data-on="1"] { fill: var(--ln-hi); stroke: var(--ln-hi); }
.rig .cell.core { fill: var(--ln-soft); stroke: none; }
/* lamps */
.rig .lamp { stroke: var(--ln-mid); stroke-width: 1; fill: var(--f-top); }
.rig .lamp[data-s="run"] { fill: var(--signal); stroke: var(--signal); }
.rig .lamp[data-s="pass"] { fill: var(--ln-hi); stroke: var(--ln-hi); }
.rig .lamp[data-s="fail"] { fill: var(--error); stroke: var(--error); }
.rig .lamp[data-s="skip"] { stroke-dasharray: 2 2; }
.rig .sens { fill: var(--f-top); stroke: var(--ln-lo); stroke-width: .8; }
.rig .sens[data-on="1"] { fill: var(--signal); stroke: var(--signal); }
.rig .led { fill: var(--ln-soft); stroke: none; }
.rig [data-on="1"] > .led { fill: var(--signal); }
.rig .lcd { fill: var(--panel); stroke: var(--ln-mid); stroke-width: .8; }
.rig .lcd[data-on="1"] { fill: var(--signal-tint); stroke: var(--signal); }
/* acceptance stamps */
.rig .stamp-box { fill: var(--sheet); stroke: var(--ln-lo); stroke-width: .9; stroke-dasharray: 2 1.6; }
.rig .stamp-ok, .rig .stamp-x, .rig .stamp-sk { fill: none; stroke-width: 1.5; display: none; }
.rig [data-s="run"] > .stamp-box { stroke: var(--signal); stroke-width: 2; stroke-dasharray: none; fill: var(--signal-tint); }
.rig [data-s="pass"] > .stamp-box { fill: var(--ln-hi); stroke: var(--ln-hi); stroke-dasharray: none; }
.rig [data-s="pass"] > .stamp-ok { display: inline; stroke: var(--sheet); }
.rig [data-s="fail"] > .stamp-box { fill: var(--error); stroke: var(--error); stroke-dasharray: none; }
.rig [data-s="fail"] > .stamp-x { display: inline; stroke: var(--on-signal); }
.rig [data-s="skip"] > .stamp-sk { display: inline; stroke: var(--ln-lo); stroke-width: 1; }
.rig .card-f { fill: var(--sheet); stroke: var(--ln-mid); stroke-width: 1; }
.rig .card-f.act { stroke: var(--signal); stroke-width: 2; }
</style>

<main class="page">
  <figure id="fig">
    <div class="card">
      <header class="card-head">
        <span class="label fig-n">Fig. 01</span>
        <h1 class="card-title">A esteira de testes do cubo mágico</h1>
      </header>
      <div class="plate" id="plate" tabindex="0" role="button" aria-label="Esteira de testes. Ative para rodar de novo.">
        <svg class="rig" id="rig" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rig-t">
          <title id="rig-t">Uma esteira leva um cubo mágico por cinco estações de teste: unitário, integração, sistema, performance e E2E. Na frente de cada estação, uma ficha do documento modelo recebe o carimbo de aceitação.</title>
        </svg>
      </div>
      <footer class="card-foot">
        <span class="label muted"><span class="h-wide">Clique na esteira para rodar de novo · escolha um defeito abaixo</span><span class="h-narrow">Arraste para os lados · toque para repetir</span></span>
        <div class="readout" aria-live="off"><span id="ro-text">Pronto</span><span class="flag" id="ro-flag" data-s="pend">Pendente</span></div>
      </footer>
    </div>

    <div class="controls">
      <div class="ctl">
        <span class="label muted" id="fault-l">Defeito</span>
        <div class="seg" role="group" aria-labelledby="fault-l">
          <button type="button" id="m-none" data-mode="none" aria-pressed="true">Nenhum</button>
          <button type="button" id="m-peca" data-mode="peca" aria-pressed="false">Peça fora de medida</button>
          <button type="button" id="m-junta" data-mode="junta" aria-pressed="false">Junta dura</button>
          <button type="button" id="m-pop" data-mode="pop" aria-pressed="false">Peça salta</button>
          <button type="button" id="m-trava" data-mode="trava" aria-pressed="false">Travamento</button>
          <button type="button" id="m-adesivo" data-mode="adesivo" aria-pressed="false">Adesivo trocado</button>
          <button type="button" id="m-limite" data-mode="limite" aria-pressed="false">Limite errado no teste</button>
        </div>
      </div>
      <div class="ctl">
        <span class="label muted" id="theme-l">Tema</span>
        <div class="seg" role="group" aria-labelledby="theme-l">
          <button type="button" id="t-paper" data-skin="paper" aria-pressed="false">Paper</button>
          <button type="button" id="t-void" data-skin="void" aria-pressed="false">Void</button>
          <button type="button" id="t-blueprint" data-skin="blueprint" aria-pressed="false">Blueprint</button>
        </div>
      </div>
    </div>

    <section class="stages" aria-label="Etapas da esteira">

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("rig");

  /* ---------- camera (orthographic, unit scale) ---------- */
  const AZ = 24 * Math.PI / 180, EL = 30 * Math.PI / 180;
  const ca = Math.cos(AZ), sa = Math.sin(AZ), ce = Math.cos(EL), se = Math.sin(EL);
  const VIEW = [sa * ce, ca * ce, se];
  const P = (x, y, z) => [x * ca - y * sa, (x * sa + y * ca) * se - z * ce];
  const r2 = n => Math.round(n * 100) / 100;
  const r3 = n => Math.round(n * 1000) / 1000;
  const D = (pts, close = true) => pts.length ? "M" + pts.map(p => r2(p[0]) + " " + r2(p[1])).join("L") + (close ? "Z" : "") : "";
  const proj = a => a.map(p => P(p[0], p[1], p[2]));
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const nrm = a => mul(a, 1 / Math.hypot(a[0], a[1], a[2]));
  const fmt = (n, d) => n.toFixed(d).replace(".", ",");

  function hull(pts) {
    const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const q of p) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
    for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
    up.pop(); lo.pop(); return lo.concat(up);
  }

  /* ---------- primitives ---------- */
  const path = (d, cls, extra = "") => `<path class="${cls}" d="${d}"${extra}/>`;
  function box(x0, x1, y0, y1, z0, z1, line = "mid", o = {}) {
    let s = "";
    s += path(D(proj([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]])), `fy ${line}`);
    s += path(D(proj([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]])), `fx ${line}`);
    s += path(D(proj([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]])), `ft ${line}`);
    if (o.bevel) { const b = o.bevel; s += path(D(proj([[x0, y1, z1 - b], [x1, y1, z1 - b], [x1, y0, z1 - b]]), false), "ln soft"); }
    if (o.band) { const z = o.band; s += path(D(proj([[x0, y1, z], [x1, y1, z], [x1, y0, z]]), false), "ln soft"); }
    return s;
  }
  const flat = (x0, x1, y0, y1, z, cls, attr = "") => path(D(proj([[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]])), cls, attr);
  const seg3 = (pts, cls) => path(D(proj(pts), false), cls);
  function basis(axis) {
    const a = nrm(axis); const t = Math.abs(a[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
    const u = nrm(cross(a, t)); const v = cross(a, u); return { a, u, v };
  }
  function ring(c, axis, r, N = 40) {
    const { u, v } = basis(axis); const out = [];
    for (let i = 0; i < N; i++) { const t = 2 * Math.PI * i / N; out.push(P(...add(c, add(mul(u, r * Math.cos(t)), mul(v, r * Math.sin(t)))))); }
    return out;
  }
  function cylGeom(c0, c1, r, N = 40) {
    const ax = sub(c1, c0); const { a } = basis(ax);
    const q0 = ring(c0, ax, r, N), q1 = ring(c1, ax, r, N);
    return { side: D(hull(q0.concat(q1))), cap: D(dot(a, VIEW) >= 0 ? q1 : q0) };
  }
  function cyl(c0, c1, r, line = "mid", o = {}) {
    const g = cylGeom(c0, c1, r);
    return path(g.side, `fc ${line}`) + path(g.cap, `${o.capCls || "fk"} ${line}`, o.capAttr || "");
  }
  function arc(c, axis, r, n = 18) {
    const { u, v } = basis(axis); const phi = Math.atan2(dot(v, VIEW), dot(u, VIEW)); const out = [];
    for (let i = 0; i <= n; i++) { const t = phi - Math.PI / 2 + Math.PI * i / n; out.push(P(...add(c, add(mul(u, r * Math.cos(t)), mul(v, r * Math.sin(t)))))); }
    return D(out, false);
  }
  function knurl(c0, c1, r, count, phase = 0, minVis = 0.15) {
    const { u, v } = basis(sub(c1, c0)); let d = "";
    for (let k = 0; k < count; k++) {
      const t = phase + 2 * Math.PI * k / count; const nv = add(mul(u, Math.cos(t)), mul(v, Math.sin(t)));
      if (dot(nv, VIEW) < minVis) continue;
      d += D(proj([add(c0, mul(nv, r)), add(c1, mul(nv, r))]), false);
    }
    return d;
  }
  const screw = (c, axis = [0, 0, 1], r = 1.4) => path(D(ring(c, axis, r, 20)), "ft lo") + path(D(ring(c, axis, r * 0.38, 10)), "dotf");
  function ball(c, r, cls = "fc mid") {
    const o = P(...c); const pts = [];
    for (let i = 0; i < 24; i++) { const t = 2 * Math.PI * i / 24; pts.push([o[0] + r * Math.cos(t), o[1] + r * Math.sin(t)]); }
    return path(D(pts), cls);
  }
  // oriented box: centre c, half-axis vectors ax[3]
  function obb(c, ax, line = "mid") {
    let s = "";
    for (let i = 0; i < 3; i++) for (const sg of [1, -1]) {
      const n = mul(ax[i], sg); if (dot(n, VIEW) <= 1e-6) continue;
      const a = ax[(i + 1) % 3], b = ax[(i + 2) % 3], f = add(c, n);
      const nn = nrm(n);
      const tone = nn[2] > 0.6 ? "ft" : Math.abs(nn[1]) >= Math.abs(nn[0]) ? "fy" : "fx";
      s += path(D(proj([add(add(f, a), b), add(sub(f, a), b), sub(sub(f, a), b), sub(add(f, a), b)])), `${tone} ${line}`);
    }
    return s;
  }
  // a plane: (a, b, h) -> screen
  const plane = (O, eA, eB, n) => (a, b, h = 0) => P(...add(add(add(O, mul(eA, a)), mul(eB, b)), mul(n, h)));
  function textIn(pm, a, b, str, size, cls, anchor = "start", attr = "") {
    const o = pm(a, b), x1 = pm(a + 1, b), y1 = pm(a, b + 1);
    return `<text class="${cls}" transform="matrix(${r3(x1[0] - o[0])} ${r3(x1[1] - o[1])} ${r3(y1[0] - o[0])} ${r3(y1[1] - o[1])} ${r2(o[0])} ${r2(o[1])})" font-size="${size}" text-anchor="${anchor}" dominant-baseline="central"${attr}>${str}</text>`;
  }
  const quadIn = (pm, a0, b0, a1, b1, h = 0) => [pm(a0, b0, h), pm(a1, b0, h), pm(a1, b1, h), pm(a0, b1, h)];
  const circleIn = (pm, ca_, cb_, r, n = 28, h = 0) => { const o = []; for (let i = 0; i < n; i++) { const t = 2 * Math.PI * i / n; o.push(pm(ca_ + r * Math.sin(t), cb_ - r * Math.cos(t), h)); } return o; };
  const arcIn = (pm, ca_, cb_, r, f0, f1, n = 24) => { const o = []; for (let i = 0; i <= n; i++) { const t = (f0 + (f1 - f0) * i / n) * Math.PI / 180; o.push(pm(ca_ + r * Math.sin(t), cb_ - r * Math.cos(t))); } return o; };
  const polar = (ca_, cb_, r, deg) => { const t = deg * Math.PI / 180; return [ca_ + r * Math.sin(t), cb_ - r * Math.cos(t)]; };

  /* ---------- stickers ---------- */
  const ST = { U: "w", D: "l", F: "m", B: "d", R: "h", L: "k" };
  const ST_FILL = { w: "sw", l: "sl", m: "sm", h: "sw", d: "sl", k: "sw" };
  const bil = (q, u, v) => [q[0][0] + (q[1][0] - q[0][0]) * u + (q[3][0] - q[0][0]) * v, q[0][1] + (q[1][1] - q[0][1]) * u + (q[3][1] - q[0][1]) * v];
  function facelet(q, c, simple = false) {
    let s = path(D(q), `st ${ST_FILL[c]}`);
    if (c === "h") {
      s += simple ? path(D([bil(q, 1, 0), bil(q, 0, 1)], false), "gl-l thin")
        : path(D([bil(q, .45, 0), bil(q, 0, .45)], false) + D([bil(q, 1, 0), bil(q, 0, 1)], false) + D([bil(q, 1, .55), bil(q, .55, 1)], false), "gl-l");
    } else if (c === "d") {
      const pts = []; for (let i = 0; i < 14; i++) { const t = 2 * Math.PI * i / 14; pts.push(bil(q, .5 + .21 * Math.cos(t), .5 + .21 * Math.sin(t))); }
      s += path(D(pts), "gl-f");
    } else if (c === "k") s += path(D([bil(q, 1, 0), bil(q, 1, 1), bil(q, 0, 1)]), "gl-f");
    return s;
  }

  /* ---------- cube model ---------- */
  const E = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  const FACES = { U: [2, 1], D: [2, -1], F: [1, 1], B: [1, -1], R: [0, 1], L: [0, -1] };
  const fname = (a, s) => a === 2 ? (s > 0 ? "U" : "D") : a === 1 ? (s > 0 ? "F" : "B") : (s > 0 ? "R" : "L");
  const I3 = [1, 0, 0, 0, 1, 0, 0, 0, 1];
  const mm = (A, B) => { const C = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) C.push(A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j]); return C; };
  const mv = (A, v) => [A[0] * v[0] + A[1] * v[1] + A[2] * v[2], A[3] * v[0] + A[4] * v[1] + A[5] * v[2], A[6] * v[0] + A[7] * v[1] + A[8] * v[2]];
  const mt = A => [A[0], A[3], A[6], A[1], A[4], A[7], A[2], A[5], A[8]];
  function rot(a, th) {
    const c = Math.cos(th), s = Math.sin(th);
    if (a === 0) return [1, 0, 0, 0, c, -s, 0, s, c];
    if (a === 1) return [c, 0, s, 0, 1, 0, -s, 0, c];
    return [c, -s, 0, s, c, 0, 0, 0, 1];
  }
  const pname = h => (h[2] ? (h[2] > 0 ? "U" : "D") : "") + (h[1] ? (h[1] > 0 ? "F" : "B") : "") + (h[0] ? (h[0] > 0 ? "R" : "L") : "");
  const ptype = h => ["", "centro", "aresta", "canto"][Math.abs(h[0]) + Math.abs(h[1]) + Math.abs(h[2])];
  function newCube() {
    const ps = [];
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) for (let k = -1; k <= 1; k++) {
      if (!i && !j && !k) continue;
      ps.push({ id: ps.length, home: [i, j, k], pos: [i, j, k], R: I3.slice(), moved: false, name: pname([i, j, k]) });
    }
    return ps;
  }
  let cube = newCube();
  function applyMove(face, q) {
    const [a, s] = FACES[face]; const M = rot(a, -Math.PI / 2 * s * q).map(Math.round);
    for (const p of cube) if (p.pos[a] === s) { p.pos = mv(M, p.pos).map(Math.round); p.R = mm(M, p.R).map(Math.round); p.moved = true; }
  }
  function stickerCls(p, a, s) {
    if (p.home[a] !== s) return null;
    const f = fname(a, s);
    if (st.swap && p.name === "FR") return f === "F" ? "h" : "m";
    return ST[f];
  }
  function facelets() {
    const m = {};
    for (const p of cube) for (let a = 0; a < 3; a++) {
      const s = p.pos[a]; if (!s) continue;
      const ln = mv(mt(p.R), mul(E[a], s));
      let la = 0; for (let i = 1; i < 3; i++) if (Math.abs(ln[i]) > Math.abs(ln[la])) la = i;
      const b = (a + 1) % 3, c = (a + 2) % 3;
      m[`${a}${s}:${p.pos[b]}:${p.pos[c]}`] = stickerCls(p, la, Math.sign(ln[la]));
    }
    return m;
  }
  const REF = {};
  for (const [a, s] of [[0, 1], [0, -1], [1, 1], [1, -1], [2, 1], [2, -1]]) for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) REF[`${a}${s}:${i}:${j}`] = ST[fname(a, s)];
  const VISIBLE = [[2, 1, "cbt"], [1, 1, "cby"], [0, 1, "cbx"]];

  function miniCube(pm, cx, cy, k, map, opt = {}) {
    const to = v => { const q = P(v[0], v[1], v[2]); return pm(cx + q[0] * k, cy + q[1] * k); };
    let s = "", marks = "";
    for (const [a, sg, tone] of VISIBLE) {
      const b = (a + 1) % 3, c = (a + 2) % 3, n = mul(E[a], sg * 28.5);
      const cor = (u, v) => to(add(n, add(mul(E[b], u), mul(E[c], v))));
      s += path(D([cor(-28.5, -28.5), cor(28.5, -28.5), cor(28.5, 28.5), cor(-28.5, 28.5)]), `cb ${tone}`);
      for (let ib = -1; ib <= 1; ib++) for (let ic = -1; ic <= 1; ic++) {
        const key = `${a}${sg}:${ib}:${ic}`, g = opt.g || 8;
        const u0 = ib * 19, v0 = ic * 19;
        s += facelet([cor(u0 - g, v0 - g), cor(u0 + g, v0 - g), cor(u0 + g, v0 + g), cor(u0 - g, v0 + g)], map[key], true);
        if (opt.marks && opt.marks.includes(key)) marks += path(D([cor(u0 - 9.5, v0 - 9.5), cor(u0 + 9.5, v0 - 9.5), cor(u0 + 9.5, v0 + 9.5), cor(u0 - 9.5, v0 + 9.5)]), "mism");
      }
    }
    return s + marks;
  }

  /* ---------- layout (mm) ---------- */
  const CY = 115;
  const SX = [164, 236, 356, 476, 596, 716];   // 0 = start, 1..5 = stations 02..06
  const RING_PARK = 133, PITCH0 = 19, EXPL = 6;
  const PARK = { L: 36, R: 36, F: 9, U: 12 };

  /* ---------- scene items ---------- */
  const items = [];
  function item(id, html, box, opt = {}) { const it = { id, html, box0: box, box, dz: 0, fixed: opt.bucket, el: null, bucket: -1 }; items.push(it); return it; }

  // ---- base plate
  {
    let s = "";
    for (const [fx, fy] of [[10, 10], [410, 10], [810, 10], [10, 176], [410, 176], [810, 176]]) s += box(fx, fx + 20, fy, fy + 14, -5, 0, "lo");
    s += box(0, 840, 0, 200, 0, 12, "mid", { bevel: 1.6 });
    s += path(D(proj([[5, 5, 12], [835, 5, 12], [835, 195, 12], [5, 195, 12]])), "ln soft");
    for (const [x, y] of [[10, 10], [830, 10], [10, 190], [830, 190]]) s += screw([x, y, 12]);
    item("base", s, null, { bucket: 0 });
  }

  // ---- 01 drafting table (requirements)
  const O = [14, 150, 54], eA = [1, 0, 0], eU = nrm([0, -80, 70]), nB = nrm(cross(eA, eU).map(v => -v)), LB = 106;
  const board = (a, u, h = 0) => add(add(add(O, mul(eA, a)), mul(eU, u)), mul(nB, h));
  const bP = (a, u, h = 0) => P(...board(a, u, h));
  const sheetPM = (a, b, h = 0.4) => bP(6 + a, 102 - b, h);
  {
    let s = "";
    for (const x of [22, 96]) s += box(x - 4, x + 4, 72, 152, 12, 16, "lo");
    s += box(19, 25, 107, 113, 16, 86.5, "mid");
    s += box(25, 93, 108, 112, 28, 33, "mid");
    s += box(93, 99, 107, 113, 16, 86.5, "mid");
    // board: edges then face

        call(() => { st.hl = p.id; st.cubeDirty = true; ro(`Etapa 2/6 · Unitário · peça ${i}/26 · ${ptype(p.home)} ${p.name} · ${fmt(v, 2)} mm`, ok ? "run" : "fail"); });
        wait(ok ? 0.14 : 0.5);
        call(() => { st.hl = null; if (!ok) st.bad = p.id; st.cubeDirty = true; });
        if (!ok) { unitFail = { p, v }; break outer; }
      }
    }
    moveTo("ring", RING_PARK, 150);
    call(() => { st.leds = false; });
    if (unitFail) { stop(1, "test", `Parou na etapa 2 · ${ptype(unitFail.p.home)} ${unitFail.p.name} mede ${fmt(unitFail.v, 2)} mm · limite 19,00 ±0,05`); return; }
    call(() => test(1, "pass"));
    accept(1, true, "26 peças · 19,00 ±0,05 mm");
    moveTo("explode", 0, 1, () => ro("Montagem · as três camadas se encaixam", "run"));

    // 03 integration
    transport(2);
    call(() => { test(2, "run"); ro("Etapa 3/6 · Integração · o robô segura o cubo pelos centros", "run"); });
    engage(2, true);
    let jFail = null, maxT = 0;
    for (const f of ["U", "F", "R", "D", "B", "L"]) {
      const tq = F.torque[f], okT = tq <= F.testLimit + 1e-9, slow = tq > 1.3;
      maxT = Math.max(maxT, tq);
      turn(f, slow ? 1.0 : 0.45, { start() { ro(`Etapa 3/6 · Integração · junta ${f} · ¼ de volta`, "run"); }, tick(t) { st.dial = tq * Math.min(1, t * 3); }, end() { ro(`Etapa 3/6 · Integração · junta ${f} · ${fmt(tq, 2)} N·cm`, okT ? "run" : "fail"); } });
      wait(okT ? 0.12 : 0.6);
      turn(f + "'", 0.45, { tick(t) { st.dial = tq * (1 - t); } });
      if (!okT) { jFail = { f, tq }; break; }
    }
    engage(2, false);
    if (jFail) { stop(2, "test", `Parou na etapa 3 · junta ${jFail.f} · ${fmt(jFail.tq, 2)} N·cm > ${fmt(F.testLimit, 1)}`); return; }
    call(() => test(2, "pass"));
    const accInt = maxT <= 1.0 + 1e-9;
    accept(2, accInt, `torque máx. ${fmt(maxT, 2)} N·cm · documento ≤ 1,0`);
    if (!accInt) { stop(2, "acc", `Parou na aceitação 3 · o teste usava 1,5 N·cm; o documento pede ≤ 1,0 · junta F ${fmt(maxT, 2)}`); return; }

    // 04 system
    transport(3);
    call(() => { test(3, "run"); for (const p of cube) p.moved = false; setCover(true); ro("Etapa 4/6 · Sistema · embaralhar 12 movimentos", "run"); });
    engage(3, true);
    let popped = false;
    for (let i = 0; i < SCR12.length; i++) {
      const m = SCR12[i];
      turn(m, 0.3, { end() { const c = setCover(true); ro(`Etapa 4/6 · Sistema · embaralhar ${i + 1}/12 · ${m} · peças movidas ${c}/26`, "run"); } });
      if (F.pop && i + 1 === F.pop) {
        call(() => { const p = cube.find(q => q.pos[0] === 1 && q.pos[1] === 1 && q.pos[2] === 1); st.popId = p.id; st.cubeDirty = true; st.popName = `${ptype(p.home)} ${p.name}`; });
        tween(0.3, t => { st.pop = 12 * t; st.cubeDirty = true; });
        popped = true; break;
      }
    }
    if (popped) { stop(3, "test", `Parou na etapa 4 · a peça saltou no movimento ${F.pop}/24`); return; }
    wait(0.35, () => ro("Etapa 4/6 · Sistema · resolver 12 movimentos", "run"));
    solveOf(SCR12).forEach((m, i) => turn(m, 0.3, { end() { ro(`Etapa 4/6 · Sistema · resolver ${i + 1}/12 · ${m} · peças movidas ${setCover(true)}/26`, "run"); } }));
    engage(3, false);
    call(() => { test(3, "pass"); ro("Etapa 4/6 · Sistema · resolvido · 26/26 peças movidas", "pass"); });
    wait(0.4);
    accept(3, true, "24 movimentos · 26/26 movidas · resolvido");

    // 05 performance
    transport(4);
    call(() => { test(4, "run"); st.watch = 0; ro("Etapa 5/6 · Performance · 40 movimentos contra o relógio", "run"); });
    engage(4, true);
    const seq = SCR20.concat(solveOf(SCR20)), MOVE = 0.08;
    seq.forEach((m, i) => {
      const stall = F.stall === i + 1, dur = stall ? MOVE + 1.1 : MOVE;
      turn(m, dur, {
        shape: stall ? t => { const a = 0.03 / dur, b = 1 - 0.05 / dur; return t < a ? (t / a) * 0.38 : t < b ? 0.38 : 0.38 + 0.62 * (t - b) / (1 - b); } : null,
        start() { this.base = st.watch; },
        tick(t) { st.watch = this.base + t * dur; ro(`Etapa 5/6 · Performance · ${i + 1}/40 · ${fmt(st.watch, 2)} s${stall && t > 0.05 && t < 0.95 ? " · travou" : ""}`, st.watch > 4 ? "fail" : "run"); },
      });
    });
    engage(4, false);
    const total = seq.length * MOVE + (F.stall ? 1.1 : 0), perfOk = total <= 4.0 + 1e-9;
    if (!perfOk) { stop(4, "test", `Parou na etapa 5 · ${fmt(total, 2)} s para 40 movimentos · limite 4,0 s`); return; }
    call(() => test(4, "pass"));
    accept(4, true, `40 movimentos em ${fmt(total, 2)} s · documento ≤ 4,0 s`);

    // 06 E2E
    transport(5);
    call(() => { test(5, "run"); ro("Etapa 6/6 · E2E · a câmera fotografa o cubo", "run"); });
    wait(0.35, () => el.camLcd.setAttribute("data-on", "1"));
    call(() => { el.camLcd.setAttribute("data-on", "0"); st.photo = facelets(); el.monPhoto.innerHTML = miniCube(monPM, 60, 19.5, 0.33, st.photo); el.monStat.textContent = "… / 27"; });
    wait(0.35);
    tween(1.1, t => { st.scan = t; }, () => ro("Etapa 6/6 · E2E · comparando a foto com a imagem do modelo", "run"));
    let mism = [];
    call(() => {
      st.scan = null;
      mism = VISIBLE.flatMap(([a, s]) => { const o = []; for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) { const k = `${a}${s}:${i}:${j}`; if (st.photo[k] !== REF[k]) o.push(k); } return o; });
      const same = 27 - mism.length;
      el.monStat.textContent = `${same}/27`;
      if (mism.length) el.monPhoto.innerHTML = miniCube(monPM, 60, 19.5, 0.33, st.photo, { marks: mism });
      ro(`Etapa 6/6 · E2E · ${same}/27 adesivos iguais à imagem`, mism.length ? "fail" : "pass");
    });
    wait(0.4);
    if (F.swap) { stop(5, "test", "Parou na etapa 6 · 25/27 adesivos iguais · aresta FR com adesivos trocados"); return; }
    call(() => test(5, "pass"));
    accept(5, true, "27/27 adesivos iguais à imagem");
    call(() => ro("Esteira completa · 5 testes e 5 aceitações passaram", "pass"));
    wait(5.5);
    tween(0.25, t => { st.fade = 1 - t; });
  }

  /* ---------- loop, tour, controls ---------- */
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const TOUR = ["none", "limite", "pop", "adesivo", "peca", "junta", "trava"];
  let tourIdx = 0, touched = false, chosen = "none", raf = 0, last = 0, visible = true;
  function nextRun() { plan(touched ? chosen : TOUR[tourIdx++ % TOUR.length]); }
  function advance(dt) {
    let budget = dt;
    for (let guard = 0; guard < 2000; guard++) {
      if (!cur) {
        if (!queue.length) nextRun();
        cur = queue.shift(); curT = 0;
        if (cur.start) cur.start.call(cur);
        if (cur.dur == null) cur.dur = 0;
      }
      const remain = cur.dur - curT;
      if (budget < remain) { curT += budget; if (cur.tick) cur.tick.call(cur, cur.dur ? curT / cur.dur : 1); break; }
      budget -= Math.max(0, remain); curT = cur.dur;
      if (cur.tick) cur.tick.call(cur, 1);
      if (cur.end) cur.end.call(cur);
      cur = null;
      if (budget <= 0) break;
    }
  }
  function settle(mode) {
    plan(mode);
    for (let guard = 0; queue.length && guard < 3000; guard++) {
      const s = queue.shift(); if (s.start) s.start.call(s);
      if (s.dur >= 5) break;
      if (s.tick) s.tick.call(s, 1); if (s.end) s.end.call(s);
    }
    queue = []; cur = null; st.fade = 1; render();
  }
  function frame(t) {
    raf = 0;
    if (!visible || reduce.matches) return;
    const dt = last ? Math.min(0.05, (t - last) / 1000) : 0; last = t;
    advance(dt); render();
    raf = requestAnimationFrame(frame);
  }
  function play() { if (!raf && visible && !reduce.matches) { last = 0; raf = requestAnimationFrame(frame); } }
  function restart(mode) {
    touched = true; chosen = mode;
    if (reduce.matches) { settle(mode); return; }
    queue = []; cur = null;
    tween(0.2, t => { st.fade = Math.min(st.fade, 1 - t); });
    const q = queue; queue = []; plan(mode); queue = q.concat(queue);
    play();
  }
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => restart(b.dataset.mode)));
  const plate = $("plate");
  let userScroll = 0, downX = null;
  plate.addEventListener("pointerdown", e => { userScroll = Date.now(); downX = e.clientX; });
  plate.addEventListener("wheel", () => { userScroll = Date.now(); }, { passive: true });
  plate.addEventListener("touchstart", () => { userScroll = Date.now(); }, { passive: true });
  plate.addEventListener("click", e => { if (downX != null && Math.abs(e.clientX - downX) > 6) return; restart(touched ? chosen : st.mode); });
  plate.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); restart(touched ? chosen : st.mode); } });
  function follow(x) {
    if (plate.scrollWidth <= plate.clientWidth + 2 || Date.now() - userScroll < 5000) return;
    const vb = svg.viewBox.baseVal; if (!vb || !vb.width) return;
    const sxp = P(x, CY, 78.5)[0];
    const target = (sxp - vb.x) / vb.width * svg.clientWidth - plate.clientWidth / 2;
    plate.scrollTo({ left: Math.max(0, target), behavior: reduce.matches ? "auto" : "smooth" });
  }

  // theme (skin) switch
  const root = document.documentElement;
  function currentSkin() {
    const s = root.getAttribute("data-skin"); if (s) return s;
    const t = root.getAttribute("data-theme");
    if (t === "dark") return "void"; if (t === "light") return "paper";
    return matchMedia("(prefers-color-scheme: dark)").matches ? "void" : "paper";
  }
  function markSkin() { const s = currentSkin(); document.querySelectorAll("button[data-skin]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.skin === s))); }
  try { const saved = localStorage.getItem("cubo-esteira-skin"); if (saved) root.setAttribute("data-skin", saved); } catch (e) {}
  document.querySelectorAll("button[data-skin]").forEach(b => b.addEventListener("click", () => {
    root.setAttribute("data-skin", b.dataset.skin); markSkin();
    try { localStorage.setItem("cubo-esteira-skin", b.dataset.skin); } catch (e) {}
  }));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", markSkin);
  new MutationObserver(markSkin).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  markSkin();

  /* ---------- first frame + fit ---------- */
  resetRun("none"); render();
  {
    // fit the view to the drawing with the parked parts up
    const bb = $("scene").getBBox();
    const mx = 26, mt = 20, mb = 18;
    const x = bb.x - mx, y = bb.y - mt, W = bb.width + 2 * mx, H = bb.height + mt + mb;
    svg.setAttribute("viewBox", `${r2(x)} ${r2(y)} ${r2(W)} ${r2(H)}`);
    const bg = $("bg"); bg.setAttribute("x", r2(x)); bg.setAttribute("y", r2(y)); bg.setAttribute("width", r2(W)); bg.setAttribute("height", r2(H));
    const m = 10, l = 7; let d = "";
    for (const [cx, cy] of [[x + m, y + m], [x + W - m, y + m], [x + m, y + H - m], [x + W - m, y + H - m]]) d += `M${r2(cx - l)} ${r2(cy)}H${r2(cx + l)}M${r2(cx)} ${r2(cy - l)}V${r2(cy + l)}`;
    $("reg").setAttribute("d", d);
  }
  new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible) play(); }, { threshold: 0.05 }).observe(svg);
  reduce.addEventListener("change", () => { if (reduce.matches) settle(chosen); else play(); });
  if (reduce.matches) settle("none"); else play();

  window.__rig = { advance: s => { advance(s); render(); }, plan, st, settle, stop: () => { visible = false; }, render };
})();
</script>
