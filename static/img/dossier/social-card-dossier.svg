<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="sk-t">
  <title id="sk-t">QA Garden — uma coleção de notas em evolução (social card, estilo Dossier)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans+Condensed:wght@700&amp;family=IBM+Plex+Sans:wght@400&amp;display=swap');
    svg { --paper:#f4f4f1; --ink:#0b0c0e; --ink-muted:#50535a; --rule-soft:#c6c7c1; --signal:#002fa7; --signal-tint:#d7dff3; --inverse:#0b0c0e; --on-inverse:#f4f4f1; }
    .bg { fill: var(--paper); }
    .gridpt { fill: var(--rule-soft); }
    .band { fill: var(--inverse); }
    .hair { fill: none; stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .rule { fill: none; stroke: var(--ink); stroke-width: 2; }
    .soft { fill: none; stroke: var(--rule-soft); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .dotted { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 1 5; vector-effect: non-scaling-stroke; }
    .ticks line, .grad line { stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .glass { fill: var(--paper); stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .liquid { fill: url(#sk-hatch); }
    .surface { stroke: var(--signal); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .bubble { fill: none; stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .dot { fill: var(--ink); }
    .sig { fill: var(--signal); }
    .display { font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 104px; letter-spacing: .01em; fill: var(--on-inverse); }
    .sub { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 30px; fill: var(--ink); }
    .label { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-weight: 500; font-size: 15px; letter-spacing: .14em; fill: var(--ink); }
    .val { font-size: 17px; letter-spacing: .1em; }
    .muted { fill: var(--ink-muted); }
    .inv { fill: var(--on-inverse); }
    .end { text-anchor: end; }
  </style>
  <defs>
    <pattern id="sk-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="var(--signal-tint)"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--signal)" stroke-width="1"/>
    </pattern>
    <pattern id="sk-grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="gridpt" cx="8" cy="8" r=".7"/></pattern>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#sk-grid)"/>

  <!-- banda de cabeçalho (DataHeader) -->
  <rect class="band" width="1200" height="184"/>
  <text class="display" x="64" y="136">QA GARDEN</text>
  <text class="label inv end" x="1136" y="60">FILE 0001 · REV A</text>
  <text class="label inv end" x="1136" y="84">GABRIOLIV.GITHUB.IO/GARDEN</text>

  <!-- abertura de seção: barra signal + subtítulo -->
  <rect class="sig" x="64" y="236" width="6" height="40"/>
  <text class="sub" x="88" y="267">Uma coleção de notas em evolução</text>
  <line class="rule" x1="64" y1="300" x2="700" y2="300"/>

  <!-- ficha de campos -->
  <text class="label muted" x="64" y="352">ACERVO</text>
  <text class="label val" x="240" y="352">NOTAS · CERTIFICAÇÕES · EVOLUÇÃO</text>
  <line class="soft" x1="64" y1="372" x2="700" y2="372"/>
  <text class="label muted" x="64" y="408">ÁREA</text>
  <text class="label val" x="240" y="408">GARANTIA DE QUALIDADE</text>
  <line class="soft" x1="64" y1="428" x2="700" y2="428"/>
  <text class="label muted" x="64" y="464">FORMATO</text>
  <text class="label val" x="240" y="464">JARDIM DIGITAL · PT-BR</text>
  <line class="soft" x1="64" y1="484" x2="700" y2="484"/>

  <text class="label muted" x="64" y="582">GARDEN · REV A</text>

