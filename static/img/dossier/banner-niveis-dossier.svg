<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="720" height="480" role="img" aria-labelledby="n8-t">
  <title id="n8-t">Degraus de níveis com marcador subindo — estilo Dossier</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;display=swap');
    svg { --paper:#f4f4f1; --ink:#0b0c0e; --ink-muted:#50535a; --rule-soft:#c6c7c1; --signal:#002fa7; --signal-tint:#d7dff3; }
    @media (prefers-color-scheme: dark) {
      svg { --paper:#0a0b0d; --ink:#eeeeea; --ink-muted:#9ea1a8; --rule-soft:#2c2f36; --signal:#2b7fff; --signal-tint:#101a3c; }
    }
    .bg { fill: var(--paper); }
    .gridpt { fill: var(--rule-soft); }
    .hair { fill: none; stroke: var(--ink); stroke-width: 1; }
    .soft { fill: none; stroke: var(--rule-soft); stroke-width: 1; }
    .dotted { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 1 4; }
    .link { fill: none; stroke: var(--ink-muted); stroke-width: 1; stroke-dasharray: 1 4; }
    .plate { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .plate-soft { fill: var(--paper); stroke: var(--rule-soft); stroke-width: 1; }
    .mut { fill: none; stroke: var(--ink-muted); stroke-width: 1; }
    .sigs { fill: none; stroke: var(--signal); stroke-width: 1; }
    .dot { fill: var(--ink); }
    .sig { fill: var(--signal); }
    .tint { fill: var(--signal-tint); }
    .hatch { fill: url(#n8-hatch); }
    .dots { fill: url(#n8-dots); }
    .pt-tint { fill: var(--signal-tint); }
    .pt-line { stroke: var(--signal); stroke-width: 1; }
    .pt-dot { fill: var(--signal); }
    .pulse { fill: none; stroke: var(--ink); stroke-width: 1; opacity: 0; transform-box: fill-box; transform-origin: center; }
    .fb { transform-box: fill-box; transform-origin: center; }
    .w { fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
    .label { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; letter-spacing: .14em; fill: var(--ink); }
    .small { font-size: 8px; letter-spacing: .1em; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .muted { fill: var(--ink-muted); }
    .lsig { fill: var(--signal); }
    .halo { paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
    .ro { opacity: 0; }

    @keyframes n8h0 { 0% { opacity: 0 } 18% { opacity: 0 } 19.5% { opacity: 1 } 90% { opacity: 1 } 96% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes n8h1 { 0% { opacity: 0 } 42% { opacity: 0 } 43.5% { opacity: 1 } 90% { opacity: 1 } 96% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes n8h2 { 0% { opacity: 0 } 66% { opacity: 0 } 67.5% { opacity: 1 } 90% { opacity: 1 } 96% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes n8mk { 0% { transform: translate(52px,196px); opacity: 0 } 4% { transform: translate(52px,196px); opacity: 1 } 10% { transform: translate(52px,196px); opacity: 1 } 11% { transform: translate(58.5px,179.12px); opacity: 1 } 12% { transform: translate(65px,166px); opacity: 1 } 13% { transform: translate(71.5px,156.62px); opacity: 1 } 14% { transform: translate(78px,151px); opacity: 1 } 15% { transform: translate(84.5px,149.12px); opacity: 1 } 16% { transform: translate(91px,151px); opacity: 1 } 17% { transform: translate(97.5px,156.62px); opacity: 1 } 18% { transform: translate(104px,166px); opacity: 1 } 34% { transform: translate(104px,166px); opacity: 1 } 35% { transform: translate(114px,147.88px); opacity: 1 } 36% { transform: translate(124px,133.5px); opacity: 1 } 37% { transform: translate(134px,122.88px); opacity: 1 } 38% { transform: translate(144px,116px); opacity: 1 } 39% { transform: translate(154px,112.88px); opacity: 1 } 40% { transform: translate(164px,113.5px); opacity: 1 } 41% { transform: translate(174px,117.88px); opacity: 1 } 42% { transform: translate(184px,126px); opacity: 1 } 58% { transform: translate(184px,126px); opacity: 1 } 59% { transform: translate(194px,107.88px); opacity: 1 } 60% { transform: translate(204px,93.5px); opacity: 1 } 61% { transform: translate(214px,82.88px); opacity: 1 } 62% { transform: translate(224px,76px); opacity: 1 } 63% { transform: translate(234px,72.88px); opacity: 1 } 64% { transform: translate(244px,73.5px); opacity: 1 } 65% { transform: translate(254px,77.88px); opacity: 1 } 66% { transform: translate(264px,86px); opacity: 1 } 90% { transform: translate(264px,86px); opacity: 1 } 96% { transform: translate(264px,86px); opacity: 0 } 100% { transform: translate(52px,196px); opacity: 0 } }
    @keyframes n8p0 { 0% { opacity: 0; transform: scale(1) } 17.9% { opacity: 0; transform: scale(1) } 18% { opacity: .9; transform: scale(1) } 28% { opacity: 0; transform: scale(5) } 100% { opacity: 0; transform: scale(5) } }
    @keyframes n8p1 { 0% { opacity: 0; transform: scale(1) } 41.9% { opacity: 0; transform: scale(1) } 42% { opacity: .9; transform: scale(1) } 52% { opacity: 0; transform: scale(5) } 100% { opacity: 0; transform: scale(5) } }
    @keyframes n8p2 { 0% { opacity: 0; transform: scale(1) } 65.9% { opacity: 0; transform: scale(1) } 66% { opacity: .9; transform: scale(1) } 76% { opacity: 0; transform: scale(5) } 100% { opacity: 0; transform: scale(5) } }
    @keyframes n8fl { 0% { transform: scaleX(0) } 66% { transform: scaleX(0) } 70% { transform: scaleX(1) } 90% { transform: scaleX(1) } 96% { transform: scaleX(0) } 100% { transform: scaleX(0) } }
    .flag { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
    @keyframes n8c0 { 0% { opacity: 1 } 18% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes n8c1 { 0% { opacity: 0 } 18% { opacity: 1 } 42% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes n8c2 { 0% { opacity: 0 } 42% { opacity: 1 } 66% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes n8c3 { 0% { opacity: 0 } 66% { opacity: 1 } 96% { opacity: 0 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .ro-rest { opacity: 1; } .flag { transform: none; } .marker { transform: translate(264px,86px); }
    }
  </style>
  <defs>
    <pattern id="n8-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="pt-tint" width="6" height="6"/>
      <line class="pt-line" x1="0" y1="0" x2="0" y2="6"/>
    </pattern>
    <pattern id="n8-dots" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect class="pt-tint" width="5" height="5"/>
      <circle class="pt-dot" cx="2.5" cy="2.5" r=".9"/>
    </pattern>
    <pattern id="n8-grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="gridpt" cx="8.0" cy="8.0" r=".6"/></pattern>
  </defs>

  <rect class="bg" width="360" height="240"/>
  <rect width="360" height="240" fill="url(#n8-grid)"/>
  <line class="hair" x1="40" y1="196" x2="40" y2="66"/>
  <line class="hair" x1="30" y1="196" x2="336" y2="196"/>
  <line class="link" x1="40" y1="166" x2="64" y2="166"/>
  <line class="hair" x1="36" y1="166" x2="40" y2="166"/>
  <text class="label small muted end" x="32" y="169">N1</text>
  <line class="link" x1="40" y1="126" x2="144" y2="126"/>
  <line class="hair" x1="36" y1="126" x2="40" y2="126"/>
  <text class="label small muted end" x="32" y="129">N2</text>
  <line class="link" x1="40" y1="86" x2="224" y2="86"/>
  <line class="hair" x1="36" y1="86" x2="40" y2="86"/>
  <text class="label small muted end" x="32" y="89">N3</text>
  <rect class="plate" x="64" y="166" width="80" height="30"/>
  <rect class="hatch ro ro-rest" style="animation: n8h0 10s linear infinite" x="64.5" y="166.5" width="79" height="29"/>
  <text class="label small halo" x="70" y="180">FUNDAMENTO</text>
  <rect class="plate" x="144" y="126" width="80" height="70"/>
  <rect class="hatch ro ro-rest" style="animation: n8h1 10s linear infinite" x="144.5" y="126.5" width="79" height="69"/>
  <text class="label small halo" x="150" y="140">AVANÇADO</text>
  <rect class="plate" x="224" y="86" width="80" height="110"/>
  <rect class="hatch ro ro-rest" style="animation: n8h2 10s linear infinite" x="224.5" y="86.5" width="79" height="109"/>
  <text class="label small halo" x="230" y="100">ESPECIALISTA</text>
  <circle class="pulse" style="animation: n8p0 10s ease-out infinite" cx="104" cy="161" r="3"/>
  <circle class="pulse" style="animation: n8p1 10s ease-out infinite" cx="184" cy="121" r="3"/>
  <circle class="pulse" style="animation: n8p2 10s ease-out infinite" cx="264" cy="81" r="3"/>
  <rect class="sig marker" style="animation: n8mk 10s linear infinite" x="-5" y="-10" width="10" height="10"/>
  <line class="hair" x1="292" y1="86" x2="292" y2="54"/>
  <path class="sig flag" style="animation: n8fl 10s cubic-bezier(.3,0,.2,1) infinite" d="M292 54 L312 60 L292 66 Z"/>
  <text class="label ro" style="animation: n8c0 10s steps(1) infinite" x="14" y="46">NÍVEL · 0/3</text>
  <text class="label ro" style="animation: n8c1 10s steps(1) infinite" x="14" y="46">NÍVEL · 1/3</text>
  <text class="label ro" style="animation: n8c2 10s steps(1) infinite" x="14" y="46">NÍVEL · 2/3</text>
  <text class="label ro ro-rest" style="animation: n8c3 10s steps(1) infinite" x="14" y="46">NÍVEL · 3/3</text>
  <text class="label muted" x="14" y="24">FIG. 08 — NÍVEIS</text>
  <text class="label muted" x="14" y="226">GARDEN · REV A</text>
