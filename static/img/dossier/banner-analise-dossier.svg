    @keyframes n12c3 { 0% { opacity: 0 } 69% { opacity: 1 } 96% { opacity: 0 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .w { stroke-dashoffset: 0; } .ro-rest { opacity: 1; }
    }
