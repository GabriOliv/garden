    @keyframes n12lt2 { 0% { opacity: 0 } 69% { opacity: 0 } 70.5% { opacity: 1 } 88% { opacity: 1 } 95% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes n12lens { 0% { transform: translate(78px,62px) } 4% { transform: translate(78px,62px) } 15% { transform: translate(120px,94px) } 28% { transform: translate(120px,94px) } 39% { transform: translate(86px,130px) } 52% { transform: translate(86px,130px) } 63% { transform: translate(128px,178px) } 88% { transform: translate(128px,178px) } 97% { transform: translate(78px,62px) } 100% { transform: translate(78px,62px) } }
