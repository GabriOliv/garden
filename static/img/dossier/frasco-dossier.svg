<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="t">
  <title id="t">Frasco de laboratório girando — estilo Dossier</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;display=swap');
    svg { --paper:#f4f4f1; --ink:#0b0c0e; --ink-muted:#50535a; --rule-soft:#c6c7c1; --signal:#002fa7; --signal-tint:#d7dff3; }
    @media (prefers-color-scheme: dark) {
      svg { --paper:#0a0b0d; --ink:#eeeeea; --ink-muted:#9ea1a8; --rule-soft:#2c2f36; --signal:#2b7fff; --signal-tint:#101a3c; }
    }
    .bg { fill: var(--paper); }
    .hair { fill: none; stroke: var(--ink); stroke-width: 1; }
    .soft { fill: none; stroke: var(--rule-soft); stroke-width: 1; }
    .dotted { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 1 5; }
    .ticks line { stroke: var(--ink); stroke-width: 1; }
    .glass { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .liquid { fill: url(#hatch); }
    .surface { stroke: var(--signal); stroke-width: 2; }
    .grad line { stroke: var(--ink); stroke-width: 1; }
    .bubble { fill: none; stroke: var(--ink); stroke-width: 1; }
    .dot { fill: var(--ink); }
    .label { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; fill: var(--ink); }
    .muted { fill: var(--ink-muted); }

    .ring { transform-origin: 300px 240px; animation: turn 20s linear infinite; }
    .spin { transform-origin: 300px 0; animation: spin 8s linear infinite; }
    .bubble { animation: rise 2.4s linear infinite; opacity: 0; }
    .b2 { animation-delay: .8s; } .b3 { animation-delay: 1.6s; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes spin {
      0% { transform: scaleX(1); } 12.5% { transform: scaleX(.707); } 25% { transform: scaleX(0); }
      37.5% { transform: scaleX(-.707); } 50% { transform: scaleX(-1); } 62.5% { transform: scaleX(-.707); }
      75% { transform: scaleX(0); } 87.5% { transform: scaleX(.707); } 100% { transform: scaleX(1); }
    }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(-44px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ring, .spin, .bubble { animation: none; } .bubble { opacity: 1; } }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="var(--signal-tint)"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--signal)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect class="bg" width="720" height="480"/>

