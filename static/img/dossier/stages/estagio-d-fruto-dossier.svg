  <text class="label small muted mid" x="322" y="120">48 PX</text>
  <circle class="sigfill" cx="322" cy="145" r="5"/>
  <line class="art1" x1="322" y1="140" x2="322" y2="136.5"/>
  <path class="fill" d="M322 138.5 A3 3 0 0 1 326.33 136 A3 3 0 0 1 322 138.5 Z"/>
