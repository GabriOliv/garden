services:
  garden:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.docusaurus
    environment:
      - CHOKIDAR_USEPOLLING=true
      - GARDEN_EXAMPLES=1

  test:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /work
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - .:/work
    init: true
    ipc: host
