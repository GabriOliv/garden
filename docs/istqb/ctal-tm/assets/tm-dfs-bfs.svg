<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="db-t db-d">
  <title id="db-t">DFS e BFS: ordem de execução por risco</title>
  <desc id="db-d">Dois painéis com o mesmo exemplo de três riscos (pagamento alto, frete médio, cor do botão baixo) e nove execuções. No DFS, os testes do maior risco rodam todos primeiro, depois os do médio e por fim os do baixo. No BFS, cada rodada cobre todos os riscos ao menos uma vez, com mais testes nos riscos maiores.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap');
    svg { --paper:#f4f4f1; --panel:#e6e6e1; --ink:#0b0c0e; --ink-muted:#50535a; --rule-soft:#c6c7c1; --signal:#002fa7; --signal-tint:#d7dff3; --contrast-error:#b42318; }
    @media (prefers-color-scheme: dark) {
      svg { --paper:#0a0b0d; --panel:#16181d; --ink:#eeeeea; --ink-muted:#9ea1a8; --rule-soft:#2c2f36; --signal:#2b7fff; --signal-tint:#101a3c; --contrast-error:#ff6a55; }
    }
    .bg { fill: var(--paper); }
    .gridpt { fill: var(--rule-soft); }
    .hair { fill: none; stroke: var(--ink); stroke-width: 1; }
    .rule { fill: none; stroke: var(--ink); stroke-width: 2; }
    .soft { fill: none; stroke: var(--rule-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .plate { fill: var(--panel); stroke: var(--ink); stroke-width: 1; }
    .box { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .hatch { fill: url(#hatch); stroke: var(--ink); stroke-width: 1; }
    .focus { fill: var(--signal-tint); stroke: var(--signal); stroke-width: 2; }
    .sig { fill: var(--signal); stroke: var(--ink); stroke-width: 1; }
    .sigline { fill: none; stroke: var(--signal); stroke-width: 2; }
    .pt-ground { fill: var(--paper); }
    .pt-ink { stroke: var(--ink-muted); stroke-width: 1; }
    .ptr { fill: var(--ink); }
    .label { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; letter-spacing: .08em; fill: var(--ink); }
    .txt { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .big { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 22px; font-weight: 500; fill: var(--ink); }
    .name { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink); }
    .muted { fill: var(--ink-muted); }
    .lsig { fill: var(--signal); }
    .onsig { fill: var(--paper); }
    .end { text-anchor: end; }
    .mid { text-anchor: middle; }
  </style>
  <defs>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="pt-ground" width="4" height="4"/><line class="pt-ink" x1="0" y1="0" x2="0" y2="4"/>
    </pattern>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="gridpt" cx="8" cy="8" r=".6"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" class="ptr"/></marker>
  </defs>
  <rect class="bg" width="800" height="470"/>
  <rect width="800" height="470" fill="url(#grid)"/>
  <rect class="plate" x="20" y="20" width="760" height="26"/>
  <text class="label" x="32" y="38" >DFS · DEPTH-FIRST</text>
  <text class="txt muted" x="768" y="38" style="text-anchor:end">profundidade</text>
  <text class="name" x="32" y="78" >Pagamento falha</text>
  <text class="label lsig" x="32" y="94" >ALTO</text>
  <line class="soft" x1="200" y1="82" x2="760" y2="82"/>
  <rect class="sig" x="200" y="62" width="52" height="40"/>
  <text class="label onsig mid" x="226" y="88" >1</text>
  <rect class="sig" x="260" y="62" width="52" height="40"/>
  <text class="label onsig mid" x="286" y="88" >2</text>
  <rect class="sig" x="320" y="62" width="52" height="40"/>
  <text class="label onsig mid" x="346" y="88" >3</text>
  <rect class="sig" x="380" y="62" width="52" height="40"/>
  <text class="label onsig mid" x="406" y="88" >4</text>
  <text class="name" x="32" y="124" >Frete incorreto</text>
  <text class="label muted" x="32" y="140" >MÉDIO</text>
  <line class="soft" x1="200" y1="128" x2="760" y2="128"/>
  <rect class="sig" x="440" y="108" width="52" height="40"/>
  <text class="label onsig mid" x="466" y="134" >5</text>
  <rect class="sig" x="500" y="108" width="52" height="40"/>
  <text class="label onsig mid" x="526" y="134" >6</text>
  <rect class="sig" x="560" y="108" width="52" height="40"/>
  <text class="label onsig mid" x="586" y="134" >7</text>
  <text class="name" x="32" y="170" >Cor do botão</text>
  <text class="label muted" x="32" y="186" >BAIXO</text>
  <line class="soft" x1="200" y1="174" x2="760" y2="174"/>
  <rect class="sig" x="620" y="154" width="52" height="40"/>
  <text class="label onsig mid" x="646" y="180" >8</text>
  <rect class="sig" x="680" y="154" width="52" height="40"/>
  <text class="label onsig mid" x="706" y="180" >9</text>
  <line class="hair" x1="200" y1="204" x2="760" y2="204" marker-end="url(#arr)"/>
  <text class="label muted" x="200" y="222" >tempo</text>
  <rect class="plate" x="20" y="250" width="760" height="26"/>
  <text class="label" x="32" y="268" >BFS · BREADTH-FIRST</text>
  <text class="txt muted" x="768" y="268" style="text-anchor:end">abrangência</text>
  <text class="name" x="32" y="308" >Pagamento falha</text>
  <text class="label lsig" x="32" y="324" >ALTO</text>
  <line class="soft" x1="200" y1="312" x2="760" y2="312"/>
  <rect class="sig" x="200" y="292" width="52" height="40"/>
  <text class="label onsig mid" x="226" y="318" >1</text>
  <rect class="sig" x="380" y="292" width="52" height="40"/>
  <text class="label onsig mid" x="406" y="318" >4</text>
  <rect class="sig" x="560" y="292" width="52" height="40"/>
  <text class="label onsig mid" x="586" y="318" >7</text>
  <rect class="sig" x="680" y="292" width="52" height="40"/>
  <text class="label onsig mid" x="706" y="318" >9</text>
  <text class="name" x="32" y="354" >Frete incorreto</text>
  <text class="label muted" x="32" y="370" >MÉDIO</text>
  <line class="soft" x1="200" y1="358" x2="760" y2="358"/>
  <rect class="sig" x="260" y="338" width="52" height="40"/>
  <text class="label onsig mid" x="286" y="364" >2</text>
  <rect class="sig" x="440" y="338" width="52" height="40"/>
  <text class="label onsig mid" x="466" y="364" >5</text>
  <rect class="sig" x="620" y="338" width="52" height="40"/>
  <text class="label onsig mid" x="646" y="364" >8</text>
  <text class="name" x="32" y="400" >Cor do botão</text>
  <text class="label muted" x="32" y="416" >BAIXO</text>
  <line class="soft" x1="200" y1="404" x2="760" y2="404"/>
  <rect class="sig" x="320" y="384" width="52" height="40"/>
  <text class="label onsig mid" x="346" y="410" >3</text>
  <rect class="sig" x="500" y="384" width="52" height="40"/>
  <text class="label onsig mid" x="526" y="410" >6</text>
  <line class="hair" x1="200" y1="434" x2="760" y2="434" marker-end="url(#arr)"/>
  <text class="label muted" x="200" y="452" >tempo</text>
</svg>
