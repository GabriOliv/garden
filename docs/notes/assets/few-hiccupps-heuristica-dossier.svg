  <text class="label lsig" x="24" y="336">FASE 01 · SÓ O REQUISITO</text>
  <text class="body" x="24" y="356">A história diz uma frase: o cliente exporta o extrato do período em CSV. O arquivo baixa e o critério de aceite passa.</text>
  <text class="body" x="24" y="374">Contra essa frase nada está errado, porque ela é a única referência em uso.</text>
  </g>
  <g class="fw-p1">
  <text class="label lsig" x="24" y="336">FASE 02 · O SISTEMA CONTRA SI MESMO</text>
  <text class="body" x="24" y="356">History: a versão anterior ordenava da transação mais recente para a mais antiga. Product: a tela mostra R$ 1.234,56.</text>
  <text class="body" x="24" y="374">Explainability: o saldo final não bate com a soma das linhas, e ninguém do time sabe dizer por quê.</text>
  </g>
  <g class="fw-p2">
  <text class="label lsig" x="24" y="336">FASE 03 · O QUE AS PESSOAS DIZEM E QUEREM</text>
  <text class="body" x="24" y="356">Image: export_final_v2.csv parece improviso. Claims: a ajuda promete doze meses e o app aceita noventa dias.</text>
  <text class="body" x="24" y="374">Users' desires e Purpose: quem exporta quer abrir na planilha, conferir gastos e declarar imposto.</text>
  </g>
  <g class="fw-p3">
  <text class="label lerr" x="24" y="336">FASE 04 · O MUNDO LÁ FORA</text>
  <text class="body" x="24" y="356">Comparable: outro banco exporta e a planilha abre certo. Statutes: a RFC 4180 pede aspas no campo com vírgula.</text>
  <text class="body" x="24" y="374">World: abril não tem dia 31. Familiarity: <tspan class="lerr strong">descriÃ§Ã£o</tspan> é o velho defeito de codificação de caracteres.</text>
