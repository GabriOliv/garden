<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 800 360" width="800" height="360" role="img" aria-labelledby="fw-t fw-d">
  <title id="fw-t">FEW HICCUPPS: onze referências para uma observação — estilo Dossier</title>
  <desc id="fw-d">As onze letras de FEW HICCUPPS em fila, cada uma marcada como sistema, pessoas ou mundo. Abaixo, o arquivo de extrato exportado e um contador de incoerências. Na fase 01 só o requisito é usado e nada está errado. Na fase 02 acendem History, Product e Explainability e aparecem três incoerências. Na fase 03 acendem Image, Claims, Users' desires e Purpose e o total vai a sete. Na fase 04 acendem Comparable products, Statutes, World e Familiarity e o total chega a onze, enquanto o requisito continua atendido.</desc>
