    .file { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .strip { fill: var(--panel); stroke: var(--ink); stroke-width: 1; }
    .slot { fill: var(--paper); stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 2; }
    .sigfill { fill: var(--signal); }
    .errfill { fill: var(--contrast-error); }
    .label { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; letter-spacing: .12em; fill: var(--ink); }
    .tiny { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .06em; fill: var(--ink); }
    .big { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 24px; font-weight: 500; fill: var(--ink); }
    .code { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; letter-spacing: .02em; fill: var(--ink); }
    .body { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: var(--ink); }
    .muted { fill: var(--ink-muted); }
    .lsig { fill: var(--signal); }
    .lerr { fill: var(--contrast-error); }
    .strong { font-weight: 700; }
    .end { text-anchor: end; }
    .mid { text-anchor: middle; }
    @keyframes fw-p0 { 0%, 24% { opacity: 1 } 25%, 100% { opacity: 0 } }
    @keyframes fw-p1 { 0%, 25% { opacity: 0 } 26%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes fw-p2 { 0%, 50% { opacity: 0 } 51%, 74% { opacity: 1 } 75%, 100% { opacity: 0 } }
    @keyframes fw-p3 { 0%, 75% { opacity: 0 } 76%, 99% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes fw-f1 { 0%, 25% { opacity: 0 } 26%, 99% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes fw-f2 { 0%, 50% { opacity: 0 } 51%, 99% { opacity: 1 } 100% { opacity: 0 } }
    .fw-p0 { opacity: 0; animation: fw-p0 20s linear infinite; }
    .fw-p1 { opacity: 0; animation: fw-p1 20s linear infinite; }
    .fw-p2 { opacity: 0; animation: fw-p2 20s linear infinite; }
    .fw-p3 { opacity: 0; animation: fw-p3 20s linear infinite; }
    .fw-f1 { opacity: 0; animation: fw-f1 20s linear infinite; }
    .fw-f2 { opacity: 0; animation: fw-f2 20s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .fw-p0, .fw-p1, .fw-p2, .fw-p3, .fw-f1, .fw-f2 { animation: none; }
      .fw-p0 { opacity: 1; }
    }
