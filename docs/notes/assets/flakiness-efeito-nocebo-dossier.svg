<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 800 350" width="800" height="350" role="img" aria-labelledby="fn-t fn-d">
  <title id="fn-t">Flakiness e efeito nocebo: quando o vermelho vira ruído — estilo Dossier</title>
  <desc id="fn-d">Quatro fases de um pipeline com os últimos vinte builds. Na primeira, quase tudo passa e o único vermelho é investigado. Na segunda, um teste instável falha de vez em quando, a segunda execução passa e a confiança do time no vermelho cai. Na terceira, uma falha real aparece no meio das falhas instáveis e é ignorada. Na quarta, os testes instáveis vão para uma quarentena com limite de oito, o pipeline principal fica limpo e o vermelho volta a ser investigado. Uma barra mostra a confiança do time no vermelho em cada fase. Escala ilustrativa.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400&amp;display=swap');
    svg { --paper:#f4f4f1; --panel:#e6e6e1; --ink:#0b0c0e; --ink-muted:#50535a; --rule-soft:#c6c7c1; --signal:#002fa7; --signal-tint:#d7dff3; --contrast-error:#b42318; }
    @media (prefers-color-scheme: dark) {
      svg { --paper:#0a0b0d; --panel:#16181d; --ink:#eeeeea; --ink-muted:#9ea1a8; --rule-soft:#2c2f36; --signal:#2b7fff; --signal-tint:#101a3c; --contrast-error:#ff6a55; }
    }
    .bg { fill: var(--paper); }
    .gridpt { fill: var(--rule-soft); }
    .hair { fill: none; stroke: var(--ink); stroke-width: 1; }
    .soft { fill: none; stroke: var(--rule-soft); stroke-width: 1; }
    .tab { fill: none; stroke: var(--rule-soft); stroke-width: 1; }
    .tab-on { fill: var(--signal-tint); stroke: var(--signal); stroke-width: 1; }
    .pass { fill: var(--panel); stroke: var(--ink); stroke-width: 1; }
    .flaky { fill: url(#fn-hatch); stroke: var(--contrast-error); stroke-width: 1; stroke-dasharray: 3 2; }
    .real { fill: var(--contrast-error); stroke: var(--contrast-error); stroke-width: 1; }
    .slot { fill: none; stroke: var(--rule-soft); stroke-width: 1; stroke-dasharray: 3 3; }
    .track { fill: var(--panel); stroke: var(--rule-soft); stroke-width: 1; }
    .sigfill { fill: var(--signal); }
    .errfill { fill: var(--contrast-error); }
    .ptr-sig { fill: var(--signal); }
    .ptr-err { fill: var(--contrast-error); }
    .pt-ground { fill: var(--paper); }
    .pt-err { stroke: var(--contrast-error); stroke-width: 1; }
    .label { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; letter-spacing: .12em; fill: var(--ink); }
    .body { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: var(--ink); }
    .muted { fill: var(--ink-muted); }
    .lsig { fill: var(--signal); }
    .lerr { fill: var(--contrast-error); }
    .end { text-anchor: end; }
    .mid { text-anchor: middle; }
    @keyframes fn-p0 { 0%, 24% { opacity: 1 } 25%, 100% { opacity: 0 } }
    @keyframes fn-p1 { 0%, 25% { opacity: 0 } 26%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes fn-p2 { 0%, 50% { opacity: 0 } 51%, 74% { opacity: 1 } 75%, 100% { opacity: 0 } }
    @keyframes fn-p3 { 0%, 75% { opacity: 0 } 76%, 99% { opacity: 1 } 100% { opacity: 0 } }
    .fn-p0 { opacity: 0; animation: fn-p0 20s linear infinite; }
    .fn-p1 { opacity: 0; animation: fn-p1 20s linear infinite; }
    .fn-p2 { opacity: 0; animation: fn-p2 20s linear infinite; }
    .fn-p3 { opacity: 0; animation: fn-p3 20s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .fn-p0, .fn-p1, .fn-p2, .fn-p3 { animation: none; }
      .fn-p0 { opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="fn-hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="pt-ground" width="4" height="4"/><line class="pt-err" x1="0" y1="0" x2="0" y2="4"/>
    </pattern>
    <pattern id="fn-grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="gridpt" cx="8" cy="8" r=".6"/></pattern>
  </defs>
  <rect class="bg" y="40" width="800" height="350"/>
  <rect y="40" width="800" height="350" fill="url(#fn-grid)"/>

