  <!-- Confiança do time no vermelho -->
  <text class="label" x="24" y="272">CONFIANÇA DO TIME NO VERMELHO</text>
  <rect class="track" x="24" y="280" width="752" height="12"/>
  <rect class="sigfill fn-p0" x="24" y="280" width="662" height="12"/>
  <rect class="sigfill fn-p1" x="24" y="280" width="338" height="12"/>
  <rect class="errfill fn-p2" x="24" y="280" width="113" height="12"/>
  <rect class="sigfill fn-p3" x="24" y="280" width="564" height="12"/>

  <line class="soft" x1="24" y1="304" x2="776" y2="304"/>

  <!-- Legenda de cada fase -->
  <g class="fn-p0">
  <text class="label lsig" x="24" y="324">FASE 01 — UM VERMELHO, UMA INVESTIGAÇÃO</text>
  <text class="body" x="24" y="344">Quase todo build passa. Quando um fica vermelho, alguém abre o log no mesmo minuto.</text>
  <text class="body" x="24" y="362">O vermelho tem significado porque quase nunca aparece sem motivo.</text>
  </g>
  <g class="fn-p1">
  <text class="label lsig" x="24" y="324">FASE 02 — O TESTE DO PIX COMEÇA A PISCAR</text>
  <text class="body" x="24" y="344">Falhas intermitentes com o mesmo código. A segunda execução passa, e o time aprende a rodar de novo.</text>
  <text class="body" x="24" y="362">Cada alarme falso ensina que o vermelho pode esperar.</text>
  </g>
  <g class="fn-p2">
  <text class="label lerr" x="24" y="324">FASE 03 — A FALHA REAL CHEGA NO MEIO DO RUÍDO</text>
  <text class="body" x="24" y="344">Uma regressão de verdade deixa o build vermelho três vezes seguidas, e ninguém abre o log.</text>
  <text class="body" x="24" y="362">A fama do teste decide a leitura antes da investigação. O defeito entra com aprovação de administrador.</text>
  </g>
  <g class="fn-p3">
  <text class="label lsig" x="24" y="324">FASE 04 — QUARENTENA COM LIMITE</text>
  <text class="body" x="24" y="344">Os testes instáveis saem do pipeline principal, cada um com dono e prazo para a correção.</text>
  <text class="body" x="24" y="362">No máximo oito na quarentena, como sugere Fowler. No pipeline principal, vermelho volta a significar defeito.</text>
  </g>
</svg>
