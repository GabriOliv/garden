  <g class="fn-p3"><rect class="tab-on" x="594" y="46" width="182" height="22"/><rect class="sigfill" x="594" y="65" width="182" height="3"/></g>
  <text class="label" x="604" y="61"><tspan class="lsig">04</tspan> QUARENTENA</text>

