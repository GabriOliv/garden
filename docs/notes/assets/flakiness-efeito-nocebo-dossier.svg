  </g>

  <!-- Legenda -->
  <rect class="pass" x="24" y="240" width="10" height="10"/>
  <text class="label muted" x="40" y="249">PASSOU</text>
  <rect class="flaky" x="120" y="240" width="10" height="10"/>
