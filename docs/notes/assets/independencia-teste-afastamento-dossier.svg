<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 800 360" width="800" height="360" role="img" aria-labelledby="iv-t iv-d">
  <title id="iv-t">Independência de teste como controle deslizante — estilo Dossier</title>
  <desc id="iv-d">Um controle desliza por quatro degraus de independência: a autora, um colega do time, uma testadora de outro time e uma consultoria externa. A cada degrau caem as premissas compartilhadas com a autora e sobe o tempo para entender o sistema antes do primeiro teste: minutos, meia hora, horas e dias. Escala ilustrativa.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400&amp;display=swap');
    svg { --paper:#f4f4f1; --panel:#e6e6e1; --ink:#0b0c0e; --ink-muted:#50535a; --rule-soft:#c6c7c1; --signal:#002fa7; --signal-tint:#d7dff3; --contrast-error:#b42318; }
    @media (prefers-color-scheme: dark) {
      svg { --paper:#0a0b0d; --panel:#16181d; --ink:#eeeeea; --ink-muted:#9ea1a8; --rule-soft:#2c2f36; --signal:#2b7fff; --signal-tint:#101a3c; --contrast-error:#ff6a55; }
    }
    .bg { fill: var(--paper); }
    .gridpt { fill: var(--rule-soft); }
    .hair { fill: none; stroke: var(--ink); stroke-width: 1; }
    .soft { fill: none; stroke: var(--rule-soft); stroke-width: 1; }
    .rule { fill: none; stroke: var(--ink); stroke-width: 2; }
    .ptr { fill: var(--ink); }
    .tab { fill: none; stroke: var(--rule-soft); stroke-width: 1; }
    .tab-on { fill: var(--signal-tint); stroke: var(--signal); stroke-width: 1; }
    .stop { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .knob { fill: var(--signal-tint); stroke: var(--signal); stroke-width: 2; }
    .colhi { fill: var(--signal-tint); opacity: .55; }
    .realbar { fill: url(#iv-hatch); stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 2; }
    .sigfill { fill: var(--signal); }
    .pt-ground { fill: var(--paper); }
    .pt-ink { stroke: var(--ink); stroke-width: 1; }
    .label { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; letter-spacing: .12em; fill: var(--ink); }
    .body { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: var(--ink); }
    .muted { fill: var(--ink-muted); }
    .lsig { fill: var(--signal); }
    .lerr { fill: var(--contrast-error); }
    .end { text-anchor: end; }
    .mid { text-anchor: middle; }
    @keyframes iv-p0 { 0%, 24% { opacity: 1 } 25%, 100% { opacity: 0 } }
    @keyframes iv-p1 { 0%, 25% { opacity: 0 } 26%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes iv-p2 { 0%, 50% { opacity: 0 } 51%, 74% { opacity: 1 } 75%, 100% { opacity: 0 } }
    @keyframes iv-p3 { 0%, 75% { opacity: 0 } 76%, 99% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes iv-knob {
      0%, 20% { transform: translateX(0) }
      25%, 45% { transform: translateX(200px) }
      50%, 70% { transform: translateX(400px) }
      75%, 95% { transform: translateX(600px) }
      100% { transform: translateX(0) }
    }
    .iv-p0 { opacity: 0; animation: iv-p0 20s linear infinite; }
    .iv-p1 { opacity: 0; animation: iv-p1 20s linear infinite; }
    .iv-p2 { opacity: 0; animation: iv-p2 20s linear infinite; }
    .iv-p3 { opacity: 0; animation: iv-p3 20s linear infinite; }
    .iv-knob { animation: iv-knob 20s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .iv-p0, .iv-p1, .iv-p2, .iv-p3, .iv-knob { animation: none; }
      .iv-p0 { opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="iv-hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="pt-ground" width="4" height="4"/><line class="pt-ink" x1="0" y1="0" x2="0" y2="4"/>
    </pattern>
    <pattern id="iv-grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="gridpt" cx="8" cy="8" r=".6"/></pattern>
  </defs>
  <rect class="bg" y="40" width="800" height="360"/>
  <rect y="40" width="800" height="360" fill="url(#iv-grid)"/>

  <!-- Abas: um degrau por fase -->
  <rect class="tab" x="24" y="46" width="182" height="22"/>
  <g class="iv-p0"><rect class="tab-on" x="24" y="46" width="182" height="22"/><rect class="sigfill" x="24" y="65" width="182" height="3"/></g>
  <text class="label" x="34" y="61"><tspan class="lsig">01</tspan> AUTORA</text>
  <rect class="tab" x="214" y="46" width="182" height="22"/>
  <g class="iv-p1"><rect class="tab-on" x="214" y="46" width="182" height="22"/><rect class="sigfill" x="214" y="65" width="182" height="3"/></g>
  <text class="label" x="224" y="61"><tspan class="lsig">02</tspan> COLEGA DO TIME</text>
  <rect class="tab" x="404" y="46" width="182" height="22"/>
  <g class="iv-p2"><rect class="tab-on" x="404" y="46" width="182" height="22"/><rect class="sigfill" x="404" y="65" width="182" height="3"/></g>
  <text class="label" x="414" y="61"><tspan class="lsig">03</tspan> OUTRO TIME</text>
  <rect class="tab" x="594" y="46" width="182" height="22"/>
  <g class="iv-p3"><rect class="tab-on" x="594" y="46" width="182" height="22"/><rect class="sigfill" x="594" y="65" width="182" height="3"/></g>
  <text class="label" x="604" y="61"><tspan class="lsig">04</tspan> CONSULTORIA</text>

  <!-- Trilho do controle deslizante -->
  <text class="label muted" x="24" y="92">PERTO DO CÓDIGO</text>
  <text class="label muted end" x="776" y="92">LONGE DO CÓDIGO</text>
  <text class="label mid" x="400" y="92">INDEPENDÊNCIA</text>
  <line class="rule" x1="60" y1="110" x2="736" y2="110"/>
  <path class="ptr" d="M734 105 L744 110 L734 115 Z"/>
  <circle class="stop" cx="100" cy="110" r="4"/>
  <circle class="stop" cx="300" cy="110" r="4"/>
  <circle class="stop" cx="500" cy="110" r="4"/>
  <circle class="stop" cx="700" cy="110" r="4"/>
  <g class="iv-knob"><circle class="knob" cx="100" cy="110" r="9"/><circle class="sigfill" cx="100" cy="110" r="3"/></g>
  <text class="label mid" x="100" y="138">AUTORA</text>
  <text class="label muted mid" x="100" y="152">NENHUMA</text>
  <text class="label mid" x="300" y="138">COLEGA</text>
  <text class="label muted mid" x="300" y="152">ALGUMA</text>
  <text class="label mid" x="500" y="138">OUTRO TIME</text>
  <text class="label muted mid" x="500" y="152">ALTA</text>
  <text class="label mid" x="700" y="138">CONSULTORIA</text>
  <text class="label muted mid" x="700" y="152">MUITO ALTA</text>

  <!-- Legenda do gráfico -->
  <rect class="realbar" x="24" y="166" width="10" height="10"/>
  <text class="label muted" x="40" y="175">PREMISSAS DA AUTORA</text>
  <rect class="sigfill" x="214" y="166" width="10" height="10"/>
  <text class="label muted" x="230" y="175">TEMPO PARA ENTENDER O SISTEMA</text>
  <text class="label muted end" x="776" y="175">ESCALA ILUSTRATIVA</text>

  <!-- Coluna em destaque acompanha o controle -->
  <rect class="colhi iv-p0" x="14" y="184" width="172" height="128"/>
  <rect class="colhi iv-p1" x="214" y="184" width="172" height="128"/>
  <rect class="colhi iv-p2" x="414" y="184" width="172" height="128"/>
  <rect class="colhi iv-p3" x="614" y="184" width="172" height="128"/>

  <!-- Barras: premissas caem, tempo de entrada sobe -->
  <rect class="realbar" x="66" y="194" width="28" height="96"/>
  <rect class="sigfill" x="106" y="282" width="28" height="8"/>
  <rect class="realbar" x="266" y="218" width="28" height="72"/>
  <rect class="sigfill" x="306" y="262" width="28" height="28"/>
  <rect class="realbar" x="466" y="250" width="28" height="40"/>
  <rect class="sigfill" x="506" y="230" width="28" height="60"/>
  <rect class="realbar" x="666" y="278" width="28" height="12"/>
  <rect class="sigfill" x="706" y="194" width="28" height="96"/>
  <line class="hair" x1="24" y1="290" x2="776" y2="290"/>
  <text class="label lsig mid" x="100" y="305">MINUTOS</text>
  <text class="label lsig mid" x="300" y="305">MEIA HORA</text>
  <text class="label lsig mid" x="500" y="305">HORAS</text>
  <text class="label lsig mid" x="700" y="305">DIAS</text>

  <line class="soft" x1="24" y1="322" x2="776" y2="322"/>

  <!-- Legenda de cada fase -->
  <g class="iv-p0">
  <text class="label lsig" x="24" y="342">DEGRAU 01 — A AUTORA TESTA</text>
  <text class="body" x="24" y="362">Sabe onde cada regra mora e o que fez com pressa. Começa a testar no minuto seguinte.</text>
  <text class="body" x="24" y="380">Carrega todas as premissas da escrita, inclusive a de que toda consulta dura 30 minutos.</text>
  </g>
  <g class="iv-p1">
  <text class="label lsig" x="24" y="342">DEGRAU 02 — UM COLEGA DO TIME</text>
  <text class="body" x="24" y="362">Meia hora de conversa para entender a regra. Revisa o pull request antes de rodar o código.</text>
  <text class="body" x="24" y="380">Tem contexto para acompanhar a mudança e premissas diferentes o bastante para estranhar algo.</text>
  </g>
  <g class="iv-p2">
  <text class="label lsig" x="24" y="342">DEGRAU 03 — UMA TESTADORA DE OUTRO TIME</text>
  <text class="body" x="24" y="362">Lê o requisito, entende o convênio e monta dados com médicos, salas e pacientes.</text>
  <text class="body" x="24" y="380">Confere o comportamento contra o requisito sem saber como o código foi escrito.</text>
  </g>
  <g class="iv-p3">
  <text class="label lerr" x="24" y="342">DEGRAU 04 — UMA CONSULTORIA DE FORA</text>
  <text class="body" x="24" y="362">Passa dias aprendendo o vocabulário: retorno, encaixe, a agenda de sábado.</text>
  <text class="body" x="24" y="380">Não tem as premissas da autora nem o conhecimento dela. Sem entender, testa o óbvio.</text>
  </g>
</svg>
