<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 800 360" width="800" height="360" role="img" aria-labelledby="mt-t mt-d">
  <title id="mt-t">Três mutantes contra dois testes · estilo Dossier</title>
  <desc id="mt-d">A função calcularFrete devolve frete zero para pedidos a partir de 200 reais e tem dois testes, um pedido de 250 reais e um de 100 reais, com cobertura de linhas de 100%. Na fase 01 o código original passa nos dois testes. Na fase 02 o mutante troca o maior ou igual por menor, os dois testes falham e o mutante morre. Na fase 03 o mutante troca return frete por return 0, o teste de 100 reais falha e o mutante morre. Na fase 04 o mutante troca o maior ou igual por maior, os dois testes passam e o mutante sobrevive, porque nenhum teste usa um pedido de exatamente 200 reais. A pontuação de mutação termina em 2 de 3, 67%, com cobertura de 100%.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400&amp;display=swap');
    svg { --paper:#f4f4f1; --panel:#e6e6e1; --ink:#0b0c0e; --ink-muted:#50535a; --rule-soft:#c6c7c1; --signal:#002fa7; --signal-tint:#d7dff3; --contrast-error:#b42318; }
    @media (prefers-color-scheme: dark) {
      svg { --paper:#0a0b0d; --panel:#16181d; --ink:#eeeeea; --ink-muted:#9ea1a8; --rule-soft:#2c2f36; --signal:#2b7fff; --signal-tint:#101a3c; --contrast-error:#ff6a55; }
    }
    .bg { fill: var(--paper); }
    .gridpt { fill: var(--rule-soft); }
    .hair { fill: none; stroke: var(--ink); stroke-width: 1; }
    .soft { fill: none; stroke: var(--rule-soft); stroke-width: 1; }
    .rule { fill: none; stroke: var(--ink); stroke-width: 2; }
    .tab { fill: none; stroke: var(--rule-soft); stroke-width: 1; }
    .tab-on { fill: var(--signal-tint); stroke: var(--signal); stroke-width: 1; }
    .plate { fill: var(--panel); stroke: var(--ink); stroke-width: 1; }
    .strip-sig { fill: var(--signal-tint); stroke: var(--signal); stroke-width: 1; }
    .strip-err { fill: none; stroke: var(--contrast-error); stroke-width: 1; }
    .chip-ok { fill: var(--signal-tint); stroke: var(--signal); stroke-width: 1; }
    .chip-bad { fill: var(--contrast-error); }
    .track { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .sigfill { fill: var(--signal); }
    .errfill { fill: var(--contrast-error); }
    .dot { fill: var(--signal); }
    .gap { fill: var(--paper); stroke: var(--ink-muted); stroke-width: 1; stroke-dasharray: 2 2; }
    .gap-on { fill: none; stroke: var(--contrast-error); stroke-width: 2; }
    .label { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; letter-spacing: .12em; fill: var(--ink); }
    .code { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 500; fill: var(--ink); white-space: pre; }
    .body { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: var(--ink); }
    .muted { fill: var(--ink-muted); }
    .lsig { fill: var(--signal); }
    .lerr { fill: var(--contrast-error); }
    .lpaper { fill: var(--paper); }
    .end { text-anchor: end; }
    .mid { text-anchor: middle; }
    @keyframes mt-p0 { 0%, 24% { opacity: 1 } 25%, 100% { opacity: 0 } }
    @keyframes mt-p1 { 0%, 25% { opacity: 0 } 26%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes mt-p2 { 0%, 50% { opacity: 0 } 51%, 74% { opacity: 1 } 75%, 100% { opacity: 0 } }
    @keyframes mt-p3 { 0%, 75% { opacity: 0 } 76%, 99% { opacity: 1 } 100% { opacity: 0 } }
    .mt-p0 { opacity: 0; animation: mt-p0 20s linear infinite; }
    .mt-p1 { opacity: 0; animation: mt-p1 20s linear infinite; }
    .mt-p2 { opacity: 0; animation: mt-p2 20s linear infinite; }
    .mt-p3 { opacity: 0; animation: mt-p3 20s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .mt-p0, .mt-p1, .mt-p2, .mt-p3 { animation: none; }
      .mt-p0 { opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="mt-grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="gridpt" cx="8" cy="8" r=".6"/></pattern>
  </defs>
  <rect class="bg" y="40" width="800" height="360"/>
  <rect y="40" width="800" height="360" fill="url(#mt-grid)"/>

  <!-- Abas: uma versão do código por fase -->
  <rect class="tab" x="24" y="46" width="182" height="22"/>
  <g class="mt-p0"><rect class="tab-on" x="24" y="46" width="182" height="22"/><rect class="sigfill" x="24" y="65" width="182" height="3"/></g>
  <text class="label" x="34" y="61"><tspan class="lsig">01</tspan> ORIGINAL</text>
  <rect class="tab" x="214" y="46" width="182" height="22"/>
  <g class="mt-p1"><rect class="tab-on" x="214" y="46" width="182" height="22"/><rect class="sigfill" x="214" y="65" width="182" height="3"/></g>
  <text class="label" x="224" y="61"><tspan class="lsig">02</tspan> NEGAR CONDIÇÃO</text>
  <rect class="tab" x="404" y="46" width="182" height="22"/>
  <g class="mt-p2"><rect class="tab-on" x="404" y="46" width="182" height="22"/><rect class="sigfill" x="404" y="65" width="182" height="3"/></g>
  <text class="label" x="414" y="61"><tspan class="lsig">03</tspan> RETORNO ZERO</text>
  <rect class="tab" x="594" y="46" width="182" height="22"/>
  <g class="mt-p3"><rect class="tab-on" x="594" y="46" width="182" height="22"/><rect class="sigfill" x="594" y="65" width="182" height="3"/></g>
  <text class="label" x="604" y="61"><tspan class="lsig">04</tspan> FRONTEIRA</text>

  <!-- Painel do código -->
  <rect class="plate" x="24" y="80" width="372" height="112"/>
  <text class="label muted" x="36" y="98">CÓDIGO</text>
  <g class="mt-p1"><rect class="strip-err" x="30" y="125" width="360" height="18"/></g>
  <g class="mt-p2"><rect class="strip-err" x="30" y="143" width="360" height="18"/></g>
  <g class="mt-p3"><rect class="strip-err" x="30" y="125" width="360" height="18"/></g>
  <text class="code" x="36" y="120">function calcularFrete(totalDoPedido, frete) {</text>
  <g class="mt-p0"><text class="code" x="50" y="138">if (totalDoPedido <tspan class="lsig">&gt;=</tspan> 200) return 0;</text><text class="code" x="36" y="156">  return frete;</text></g>
  <g class="mt-p1"><text class="code" x="50" y="138">if (totalDoPedido <tspan class="lerr">&lt;</tspan> 200) return 0;</text><text class="code" x="36" y="156">  return frete;</text></g>
  <g class="mt-p2"><text class="code" x="50" y="138">if (totalDoPedido &gt;= 200) return 0;</text><text class="code" x="36" y="156">  return <tspan class="lerr">0</tspan>;</text></g>
  <g class="mt-p3"><text class="code" x="50" y="138">if (totalDoPedido <tspan class="lerr">&gt;</tspan> 200) return 0;</text><text class="code" x="36" y="156">  return frete;</text></g>
  <text class="code" x="36" y="174">}</text>
  <text class="label muted end" x="388" y="186">UMA MUDANÇA POR MUTANTE</text>

  <!-- Painel da suíte -->
  <rect class="plate" x="404" y="80" width="372" height="112"/>
  <text class="label muted" x="416" y="98">SUÍTE · 2 TESTES</text>
  <text class="body" x="416" y="124">Pedido de 250 reais, espera frete 0</text>
  <text class="body" x="416" y="150">Pedido de 100 reais, espera frete 15</text>
  <!-- status por fase: linha 1 (y 112) e linha 2 (y 138) -->
  <g class="mt-p0">
    <rect class="chip-ok" x="696" y="111" width="68" height="18"/><text class="label lsig mid" x="730" y="124">PASSA</text>
    <rect class="chip-ok" x="696" y="137" width="68" height="18"/><text class="label lsig mid" x="730" y="150">PASSA</text>
    <text class="label" x="416" y="180">CÓDIGO ORIGINAL · SUÍTE VERDE</text>
  </g>
  <g class="mt-p1">
    <rect class="chip-bad" x="696" y="111" width="68" height="18"/><text class="label lpaper mid" x="730" y="124">FALHA</text>
    <rect class="chip-bad" x="696" y="137" width="68" height="18"/><text class="label lpaper mid" x="730" y="150">FALHA</text>
    <text class="label lsig" x="416" y="180">MUTANTE MORTO · OS DOIS TESTES FALHAM</text>
  </g>
  <g class="mt-p2">
    <rect class="chip-ok" x="696" y="111" width="68" height="18"/><text class="label lsig mid" x="730" y="124">PASSA</text>
    <rect class="chip-bad" x="696" y="137" width="68" height="18"/><text class="label lpaper mid" x="730" y="150">FALHA</text>
    <text class="label lsig" x="416" y="180">MUTANTE MORTO · UM TESTE FALHA</text>
  </g>
  <g class="mt-p3">
    <rect class="chip-ok" x="696" y="111" width="68" height="18"/><text class="label lsig mid" x="730" y="124">PASSA</text>
    <rect class="chip-ok" x="696" y="137" width="68" height="18"/><text class="label lsig mid" x="730" y="150">PASSA</text>
    <text class="label lerr" x="416" y="180">MUTANTE SOBREVIVEU · NENHUM TESTE FALHA</text>
  </g>

  <!-- Reta do total do pedido: 0 a 300 reais, x = 60 + v * 2.2667 -->
  <text class="label muted" x="24" y="212">TOTAL DO PEDIDO EM REAIS</text>
  <text class="label muted end" x="776" y="212">● TESTADO   ○ SEM TESTE</text>
  <line class="hair" x1="60" y1="232" x2="740" y2="232"/>
  <line class="hair" x1="60" y1="227" x2="60" y2="237"/>
  <line class="hair" x1="740" y1="227" x2="740" y2="237"/>
  <text class="label muted mid" x="60" y="252">0</text>
  <text class="label muted mid" x="740" y="252">300</text>
  <circle class="dot" cx="287" cy="232" r="5"/>
  <text class="label mid" x="287" y="252">100</text>
  <circle class="dot" cx="627" cy="232" r="5"/>
  <text class="label mid" x="627" y="252">250</text>
  <circle class="gap" cx="513" cy="232" r="5"/>
  <text class="label muted mid" x="513" y="252">200</text>
  <g class="mt-p3">
    <circle class="gap-on" cx="513" cy="232" r="8"/>
    <text class="label lerr mid" x="513" y="216">SÓ AQUI &gt;= E &gt; DISCORDAM</text>
  </g>

  <!-- Barras: cobertura e pontuação de mutação -->
  <text class="label" x="24" y="276">COBERTURA DE LINHAS</text>
  <rect class="track" x="220" y="267" width="440" height="10"/>
  <rect class="sigfill" x="220" y="267" width="440" height="10"/>
  <text class="label lsig end" x="776" y="276">100%</text>
  <text class="label" x="24" y="300">MUTATION SCORE</text>
  <rect class="track" x="220" y="291" width="440" height="10"/>
  <g class="mt-p0"><text class="label muted end" x="776" y="300">SEM MUTANTES</text></g>
  <g class="mt-p1"><rect class="sigfill" x="220" y="291" width="440" height="10"/><text class="label lsig end" x="776" y="300">1 DE 1 · 100%</text></g>
  <g class="mt-p2"><rect class="sigfill" x="220" y="291" width="440" height="10"/><text class="label lsig end" x="776" y="300">2 DE 2 · 100%</text></g>
  <g class="mt-p3"><rect class="errfill" x="220" y="291" width="293" height="10"/><text class="label lerr end" x="776" y="300">2 DE 3 · 67%</text></g>

  <line class="soft" x1="24" y1="318" x2="776" y2="318"/>

  <!-- Legenda de cada fase -->
  <g class="mt-p0">
  <text class="label lsig" x="24" y="340">FASE 01 · O CÓDIGO DA CAMILA</text>
  <text class="body" x="24" y="360">Frete grátis a partir de 200 reais. Dois testes, 250 e 100 reais, e cobertura de 100%.</text>
  <text class="body" x="24" y="378">Tudo verde. Falta saber se os testes percebem quando o código muda.</text>
  </g>
  <g class="mt-p1">
  <text class="label lsig" x="24" y="340">FASE 02 · O &gt;= VIRA &lt;</text>
  <text class="body" x="24" y="360">O pedido de 250 reais passa a pagar frete e o de 100 sai de graça.</text>
  <text class="body" x="24" y="378">Os dois testes falham. A suíte percebeu: mutante morto.</text>
  </g>
  <g class="mt-p2">
  <text class="label lsig" x="24" y="340">FASE 03 · O RETURN FRETE VIRA RETURN 0</text>
  <text class="body" x="24" y="360">O pedido de 100 reais deixa de pagar os 15 reais de frete.</text>
  <text class="body" x="24" y="378">O teste de 100 reais falha. Mutante morto.</text>
  </g>
  <g class="mt-p3">
  <text class="label lerr" x="24" y="340">FASE 04 · O &gt;= VIRA &gt;</text>
  <text class="body" x="24" y="360">250 reais continua com frete grátis e 100 continua pagando. Os dois testes passam.</text>
  <text class="body" x="24" y="378">O mutante sobrevive: ninguém testou um pedido de exatamente 200 reais.</text>
  </g>
</svg>
